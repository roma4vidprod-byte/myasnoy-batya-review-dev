px}.filters{display:grid;grid-template-columns:1.3fr 1fr 1fr auto;gap:10px;align-items:end}.review{border-radius:18px;margin-top:12px}.reviewHead{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.stars{font-weight:800;color:#92400E}.replyBox{margin-top:14px;padding-top:14px;border-top:1px solid var(--border)}@media(max-width:780px){.filters{grid-template-columns:1fr}.row .btn{width:100%}.wrap{padding:0 12px}}</style></head><body><header class="top"><div class="brand">Мясной Батя · Review Activator</div><span class="small">ADMIN DEV</span></header><main class="wrap"><section id="authView" class="auth card"><h1>Вход в личный кабинет</h1><p class="muted">Первый вход можно выполнить через письмо на рабочую почту. После входа создайте собственный пароль.</p><div class="tabs"><button id="passwordTab" class="btn primary" onclick="setMode('password')">Пароль</button><button id="emailTab" class="btn light" onclick="setMode('email')">Вход по почте</button></div><div class="field"><label>Email</label><input id="email" type="email" value="Myasnoibatya@yandex.ru"></div><div id="passwordBlock"><div class="field"><label>Пароль</label><input id="password" type="password"></div><button class="btn primary" style="width:100%" onclick="loginPassword()">Войти</button><button class="btn light" style="width:100%;margin-top:8px" onclick="forgotPassword()">Забыли пароль?</button></div><div id="emailBlock" class="hidden"><button class="btn primary" style="width:100%" onclick="sendMagicLink()">Получить ссылку на почту</button></div><div id="authMsg"></div></section><section id="recoveryView" class="auth card hidden"><h1>Новый пароль</h1><div class="field"><label>Новый пароль</label><input id="recoveryPassword" type="password"></div><div class="field"><label>Повторите пароль</label><input id="recoveryPassword2" type="password"></div><button class="btn primary" onclick="finishRecovery()">Сохранить новый пароль</button><div id="recoveryMsg"></div></section><section id="adminView" class="hidden"><div class="card row"><div class="grow"><h1 style="margin:0">Личный кабинет</h1><div class="muted" id="profileText"></div></div><span class="pill" id="rolePill">—</span><button class="btn light" onclick="logout()">Выйти</button></div><div class="card"><div class="row"><div class="grow"><h2 style="margin:0">Отзывы</h2><div class="muted small">Яндекс · Асбест · черновики · подтверждение · статусы</div></div><button class="btn light" onclick="loadReviews()">Обновить</button></div><div class="filters"><div class="field"><label>Площадка</label><select id="fProvider"><option value="yandex">Яндекс</option></select></div><div class="field"><label>Оценка</label><select id="fRating"><option value="">Все</option><option value="low">1–3 ★</option><option value="high">4–5 ★</option></select></div><div class="field"><label>Ответ</label><select id="fAnswer"><option value="">Все</option><option value="unanswered">Без ответа</option></select></div><button class="btn primary" onclick="loadReviews()">Применить</button></div><div id="reviewsState" class="notice info">Загрузка отзывов…</div><div id="reviewsList"></div><div id="reviewsPager" class="row" style="justify-content:space-between;margin-top:12px"></div></div><div class="card"><h2>Пароль</h2><div class="field"><label>Новый пароль</label><input id="newPassword" type="password"></div><div class="field"><label>Повторите пароль</label><input id="newPassword2" type="password"></div><button class="btn primary" onclick="changePassword()">Сохранить пароль</button><div id="passwordMsg"></div></div></section></main><script>
const SUPABASE_URL='https://ykiubttldgyjpajmsuas.supabase.co',SUPABASE_KEY='sb_publishable_JoMwOnfv-S3MQ5Kr9QKFCQ_NBgvm0fY';const runtime=window.REVIEW_ACTIVATOR_RUNTIME;const isLab=runtime?.profile==='vps-lab';if(runtime&&(!isLab||location.origin!=='http://127.0.0.1:13000'||runtime.url!==location.origin))throw Error('AUTH_PROFILE_INVALID');if(!runtime&&location.origin==='http://127.0.0.1:13000')throw Error('AUTH_PROFILE_REQUIRED');const client=supabase.createClient(isLab?runtime.url:SUPABASE_URL,isLab?runtime.publicKey:SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});const ASBEST_SCOPE=Object.freeze(isLab?runtime.scope:{companyId:'13f3cb80-487a-4a19-96a1-fb3103200230',locationId:'9a95f63b-18e6-447b-a449-8530b67ddbae',externalLocationId:'54309413522',provider:'yandex',label:'Асбест · Ленинградская 41А'});const REVIEW_PAGE_SIZE=20;let reviewOffset=0;let replyWorkflow=new Map();const AUTH_ORIGINS=Object.freeze({local:'http://127.0.0.1:4173',production:'https://myasnoy-batya-review-dev.vercel.app'});function authCallbackUrl(kind='signin'){if(isLab)throw Error('LAB_EMAIL_FLOW_DISABLED');const origin=location.origin;if(origin!==AUTH_ORIGINS.local&&origin!==AUTH_ORIGINS.production)throw Error('AUTH_ORIGIN_NOT_ALLOWED');const path=origin===AUTH_ORIGINS.local?'/admin.html':'/admin';return origin+path+(kind==='recovery'?'?recovery=1':'')}function clearAuthUrl(keepRecovery=false){const u=new URL(location.href),hasAuth=u.hash||['code','access_token','refresh_token','type','error','error_code'].some(k=>u.searchParams.has(k));if(!hasAuth&&!(u.searchParams.get('recovery')==='1'&&!keepRecovery))return;history.replaceState({},document.title,u.pathname+(keepRecovery&&u.searchParams.get('recovery')==='1'?'?recovery=1':''))}function esc(s=''){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function msg(id,t,type='info'){document.getElementById(id).innerHTML=`<div class="notice ${type}">${esc(t)}</div>`}function setMode(v){passwordBlock.classList.toggle('hidden',v!=='password');emailBlock.classList.toggle('hidden',v!=='email');passwordTab.className='btn '+(v==='password'?'primary':'light');emailTab.className='btn '+(v==='email'?'primary':'light')}if(isLab){document.getElementById('email').value='owner@vps04.invalid';document.getElementById('emailTab').disabled=true;}function valid(a,b){return a.length<10?'Пароль должен быть не короче 10 символов.':a!==b?'Пароли не совпадают.':null}
async function loginPassword(){const {error}=await client.auth.signInWithPassword({email:email.value.trim().toLowerCase(),password:password.value});if(error)return msg('authMsg','Не удалось войти. Проверьте email и пароль.','bad');enterAdmin()}async function sendMagicLink(){let redirect;try{redirect=authCallbackUrl('signin')}catch{return msg('authMsg','Локальный DEV callback недоступен на этом origin.','bad')}const {error}=await client.auth.signInWithOtp({email:email.value.trim().toLowerCase(),options:{emailRedirectTo:redirect}});msg('authMsg',error?'Не удалось отправить письмо.':'Письмо отправлено.',error?'bad':'ok')}async function forgotPassword(){let redirect;try{redirect=authCallbackUrl('recovery')}catch{return msg('authMsg','Локальный DEV callback недоступен на этом origin.','bad')}const {error}=await client.auth.resetPasswordForEmail(email.value.trim().toLowerCase(),{redirectTo:redirect});msg('authMsg',error?'Не удалось отправить письмо восстановления.':'Ссылка восстановления отправлена.',error?'bad':'ok')}async function claimAndProfile(){let x=await client.rpc('review_admin_profile');if(!x.error&&x.data?.length)return x.data[0];if(!isLab)await client.rpc('review_claim_initial_owner');x=await client.rpc('review_admin_profile');if(x.error||!x.data?.length)throw Error();return x.data[0]}async function enterAdmin(){try{const {data:{session}}=await client.auth.getSession();if(!session)return showAuth();clearAuthUrl(false);const p=await claimAndProfile();authView.classList.add('hidden');recoveryView.classList.add('hidden');adminView.classList.remove('hidden');profileText.textContent=p.email;rolePill.textContent=p.role;loadReviews()}catch{await client.auth.signOut();showAuth();msg('authMsg','У этого аккаунта нет доступа к админке.','bad')}}function showAuth(){adminView.classList.add('hidden');recoveryView.classList.add('hidden');authView.classList.remove('hidden')}function showRecovery(){authView.classList.add('hidden');adminView.classList.add('hidden');recoveryView.classList.remove('hidden')}async function logout(){await client.auth.signOut();showAuth()}async function changePassword(){const e=valid(newPassword.value,newPassword2.value);if(e)return msg('passwordMsg',e,'bad');const {error}=await client.auth.updateUser({password:newPassword.value});msg('passwordMsg',error?'Не удалось сменить пароль.':'Пароль сохранён.',error?'bad':'ok')}async function finishRecovery(){const e=valid(recoveryPassword.value,recoveryPassword2.value);if(e)return msg('recoveryMsg',e,'bad');const {error}=await client.auth.updateUser({password:recoveryPassword.value});if(error)return msg('recoveryMsg','Не удалось сохранить пароль.','bad');enterAdmin()}
function stars(n){n=Math.max(0,Math.min(5,Number(n)||0));return'★'.repeat(n)+'☆'.repeat(5-n)}function dateText(v){if(!v)return'—';const d=new Date(v);return Number.isNaN(d.getTime())?'—':d.toLocaleString('ru-RU',{dateStyle:'medium',timeStyle:'short'})}function renderPager(total){const pager=document.getElementById('reviewsPager');if(!pager)return;const hasPrev=reviewOffset>0,hasNext=reviewOffset+REVIEW_PAGE_SIZE<total;pager.innerHTML=total>REVIEW_PAGE_SIZE?'<button class="btn light" '+(hasPrev?'':'disabled')+' onclick="reviewOffset=Math.max(0,reviewOffset-REVIEW_PAGE_SIZE);loadReviews(false)">Назад</button><span class="muted small">Страница '+(Math.floor(reviewOffset/REVIEW_PAGE_SIZE)+1)+' из '+Math.ceil(total/REVIEW_PAGE_SIZE)+'</span><button class="btn light" '+(hasNext?'':'disabled')+' onclick="reviewOffset=reviewOffset+REVIEW_PAGE_SIZE;loadReviews(false)">Вперёд</button>':''}async function loadReviews(reset=true){if(reset)reviewOffset=0;reviewsState.className='notice info';reviewsState.textContent='Загрузка отзывов…';reviewsList.innerHTML='';const pager=document.getElementById('reviewsPager');if(pager)pager.innerHTML='';const rating=fRating.value;const reviewRpc=isLab?'review_admin_reply_workflow_scoped':'review_admin_reviews_scoped';const {data,error}=await client.rpc(reviewRpc,{p_company_id:ASBEST_SCOPE.companyId,p_location_id:ASBEST_SCOPE.locationId,p_external_location_id:ASBEST_SCOPE.externalLocationId,p_provider:ASBEST_SCOPE.provider,p_rating_min:rating==='high'?4:null,p_rating_max:rating==='low'?3:null,p_unanswered_only:fAnswer.value==='unanswered',p_limit:REVIEW_PAGE_SIZE,p_offset:reviewOffset});if(error){reviewsState.className='notice bad';reviewsState.textContent='Не удалось загрузить отзывы. Проверьте права администратора.';return}const rows=Array.isArray(data)?data:[];replyWorkflow=new Map(rows.map(r=>[String(r.id),r]));const total=Number(rows[0]?.total_count||0);const unanswered=Number(rows[0]?.unanswered_count||0);if(!rows.length){reviewsState.className='notice info';reviewsState.textContent='Отзывов по выбранным фильтрам пока нет.';renderPager(0);return}const from=reviewOffset+1,to=Math.min(reviewOffset+rows.length,total);reviewsState.className='notice ok';reviewsState.textContent='Показано '+from+'–'+to+' из '+total+' · Без ответа: '+unanswered;reviewsList.innerHTML=rows.map(renderReview).join('');renderPager(total)}async function saveReplyDraft(id){
  const r=replyWorkflow.get(String(id))||{};
  if(r.reply_action_status&&r.reply_action_status!=='DRAFT')

  if(value.length>5000)return msg('replyMsg-'+id,'Черновик слишком длинный.','bad');
  const {error}=await client.rpc('review_admin_save_reply_draft_scoped',{
    p_external_review_row_id:id,p_company_id:ASBEST_SCOPE.companyId,
    p_location_id:ASBEST_SCOPE.locationId,p_external_location_id:ASBEST_SCOPE.externalLocationId,

  });
  if(error)return msg('replyMsg-'+id,'Не удалось сохранить черновик.','bad');
  msg('replyMsg-'+id,'Черновик сохранён.','ok');
  setTimeout(()=>loadReviews(false),250);
}
async function discardReplyDraft(id){
  const r=replyWorkflow.get(String(id))||{};
  if(r.reply_action_status&&r.reply_action_status!=='DRAFT')
    return msg('replyMsg-'+id,'Удалить можно только обычный черновик.','bad');

  });

function preparedValid(r){
  return r?.reply_action_status==='DRAFT'&&
    /^[a-f0-9]{64}$/.test(String(r.approval_fingerprint||''))&&
    /^[0-9a-f-]{36}$/i.test(String(r.idempotency_key||''))&&
    new Date(r.approval_expires_at).getTime()>Date.now();
}
function visibleTextMatches(id,r){
  const el=document.getElementById('reply-'+id);
  return String(el?.value||'').trim()===String(r?.reply_action_text||'');
}
async function prepareReply(id){
  const r=replyWorkflow.get(String(id));
  if(!r?.reply_action_id||r.reply_action_status!=='DRAFT')
    return msg('replyMsg-'+id,'Сначала сохраните черновик.','bad');
  if(!visibleTextMatches(id,r))
    return msg('replyMsg-'+id,'Текст изменён. Сначала сохраните точный текст черновика.','bad');
  if(String(r.reply_action_text||'').length>2500)
    return msg('replyMsg-'+id,'Для публикации ответ должен быть не длиннее 2500 символов.','bad');
  const {data,error}=await client.rpc('review_admin_prepare_reply_approval_scoped',{
    p_action_id:r.reply_action_id,p_external_review_row_id:id,
    p_company_id:ASBEST_SCOPE.companyId,p_location_id:ASBEST_SCOPE.locationId,
    p_external_location_id:ASBEST_SCOPE.externalLocationId,p_provider:ASBEST_SCOPE.provider,
    p_ttl_seconds:600
  });
  const proposal=Array.isArray(data)?data[0]:data;
  if(error||!proposal?.approval_fingerprint||!proposal?.idempotency_key)
    return msg('replyMsg-'+id,'Не удалось подготовить точное подтверждение.','bad');
  msg('replyMsg-'+id,'Точный текст зафиксирован для подтверждения.','ok');
  setTimeout(()=>loadReviews(false),250);
}
async function approveReply(id){
  const r=replyWorkflow.get(String(id));
  if(!preparedValid(r))
    return msg('replyMsg-'+id,'Подготовка истекла или недействительна. Подготовьте ответ заново.','bad');
  if(!visibleTextMatches(id,r))
    return msg('replyMsg-'+id,'Видимый текст отличается от подготовленного. Отправка заблокирована.','bad');
  const text=String(r.reply_action_text||'');
  if(!confirm('Подтвердить этот точный ответ?\n\n'+text+'\n\nПосле подтверждения он перейдёт в очередь отправки.'))
    return;
  const {data,error}=await client.rpc('review_admin_approve_reply_scoped',{
    p_action_id:r.reply_action_id,p_external_review_row_id:id,
    p_company_id:ASBEST_SCOPE.companyId,p_location_id:ASBEST_SCOPE.locationId,
    p_external_location_id:ASBEST_SCOPE.externalLocationId,p_provider:ASBEST_SCOPE.provider,
    p_expected_fingerprint:r.approval_fingerprint
  });
  const queued=Array.isArray(data)?data[0]:data;
  if(error||queued?.status!=='QUEUED')
    return msg('replyMsg-'+id,'Подтверждение не принято. Ничего не отправлено.','bad');
  msg('replyMsg-'+id,'Ответ подтверждён и поставлен в очередь.','ok');
  setTimeout(()=>loadReviews(false),250);
}
async function cancelQueuedReply(id){
  const r=replyWorkflow.get(String(id));
  if(r?.reply_action_status!=='QUEUED')
    return msg('replyMsg-'+id,'Отменить можно только ответ в очереди.','bad');
  if(!confirm('Вернуть подтверждённый ответ в черновик?'))return;
  const {data,error}=await client.rpc('review_admin_cancel_queued_reply_scoped',{
    p_action_id:r.reply_action_id,p_external_review_row_id:id,
    p_company_id:ASBEST_SCOPE.companyId,p_location_id:ASBEST_SCOPE.locationId,
    p_external_location_id:ASBEST_SCOPE.externalLocationId,p_provider:ASBEST_SCOPE.provider
  });
  if(error||data!==true)return msg('replyMsg-'+id,'Не удалось отменить очередь.','bad');
  loadReviews(false);
}
function actionLabel(state){
  return {DRAFT:'Черновик',QUEUED:'Подтверждён · в очереди',
    SENDING:'Отправляется',SENT:'Отправлен · ждём сверки',
    FAILED:'Ошибка · без автоповтора'}[state]||'Без действия';
}
function workflowMeta(r){
  if(!r?.reply_action_id)return '';
  let out='<div class="notice info"><b>'+esc(actionLabel(r.reply_action_status))+'</b>';
  if(r.approval_fingerprint)out+='<div class="small">Fingerprint: <code>'+esc(r.approval_fingerprint)+'</code></div>';
  if(r.idempotency_key)out+='<div class="small">Idempotency: <code>'+esc(r.idempotency_key)+'</code></div>';
  if(r.approval_expires_at)out+='<div class="small">Подтверждение до: '+esc(dateText(r.approval_expires_at))+'</div>';
  if(r.reply_action_attempt_count!==null&&r.reply_action_attempt_count!==undefined)
    out+='<div class="small">Попыток provider write: '+esc(r.reply_action_attempt_count)+'</div>';
  if(r.reply_action_last_error)out+='<div class="small">Ошибка: '+esc(r.reply_action_last_error)+'</div>';
  return out+'</div>';
}
function renderReplyWorkflow(r){
  const id=String(r.id),state=r.reply_action_status||null;
  if(!state){
    return '<div class="notice info"><b>Без ответа</b></div><div class="replyBox">'+
      '<textarea id="reply-'+esc(id)+'" maxlength="5000" placeholder="Введите ответ"></textarea>'+
      '<div class="row"><button class="btn primary" onclick="saveReplyDraft(\''+esc(id)+'\')">Сохранить черновик</button></div>'+
      '<div id="replyMsg-'+esc(id)+'"></div></div>';
  }
  const text=String(r.reply_action_text||'');
  if(state==='DRAFT'){
    const prepared=preparedValid(r);
    return workflowMeta(r)+'<div class="replyBox">'+

      '<div class="row"><button class="btn primary" onclick="saveReplyDraft(\''+esc(id)+'\')">Сохранить черновик</button>'+
      '<button class="btn light" onclick="discardReplyDraft(\''+esc(id)+'\')">Удалить черновик</button>'+
      (prepared
        ?'<button class="btn primary" onclick="approveReply(\''+esc(id)+'\')">Подтвердить отправку</button>'
        :'<button class="btn light" onclick="prepareReply(\''+esc(id)+'\')">Подготовить к подтверждению</button>')+
      '</div><div id="replyMsg-'+esc(id)+'"></div>'+
      '<div class="muted small">Подтверждение фиксирует точный текст, fingerprint и idempotency key. Браузер не обращается к Yandex reply endpoint.</div></div>';
  }
  if(state==='QUEUED'){
    return workflowMeta(r)+'<div class="replyBox"><textarea disabled readonly>'+esc(text)+'</textarea>'+
      '<div class="row"><button class="btn light" onclick="cancelQueuedReply(\''+esc(id)+'\')">Отменить до отправки</button></div>'+
      '<div id="replyMsg-'+esc(id)+'"></div><div class="muted small">Ожидает серверного one-shot writer.</div></div>';
  }
  if(state==='SENDING'){
    return workflowMeta(r)+'<div class="replyBox"><textarea disabled readonly>'+esc(text)+'</textarea>'+
      '<div class="notice info">Отправка уже началась. Повтор и редактирование заблокированы.</div><div id="replyMsg-'+esc(id)+'"></div></div>';
  }
  if(state==='SENT'){
    return workflowMeta(r)+'<div class="replyBox"><textarea disabled readonly>'+esc(text)+'</textarea>'+
      '<div class="notice ok">Ответ отправлен. Ожидается/выполняется fresh verification Яндекса.</div><div id="replyMsg-'+esc(id)+'"></div></div>';
  }
  if(state==='FAILED'){
    return workflowMeta(r)+'<div class="replyBox"><textarea disabled readonly>'+esc(text)+'</textarea>'+
      '<div class="notice bad">Автоматический повтор запрещён. Требуется проверка результата/новое действие.</div><div id="replyMsg-'+esc(id)+'"></div></div>';
  }
  return workflowMeta(r);
}
function renderReview(r){
  const hasReply=Boolean(r.owner_reply_text);
  let reply;
  if(hasReply){
    reply='<div class="notice ok"><b>Ответ компании · опубликован</b><div>'+esc(r.owner_reply_text)+'</div>'+
      '<div class="muted small">'+esc(dateText(r.owner_replied_at))+'</div></div>'+
      (isLab?workflowMeta(r):'');
  }else if(isLab){
    reply=renderReplyWorkflow(r);
  }else{
    reply='<div class="notice info"><b>Без ответа</b></div><textarea disabled readonly placeholder="Ответы отключены на этом этапе"></textarea>';
  }
  return '<div class="review"><div class="reviewHead"><span class="platform">Яндекс</span>'+
    '<span class="stars">'+stars(r.rating)+'</span><b>'+esc(r.author_name||'Гость')+'</b>'+
    '<span class="muted small">'+esc(r.location_name||ASBEST_SCOPE.label)+'</span>'+
    '<span class="muted small">'+esc(dateText(r.published_at))+'</span></div>'+
    '<p>'+esc(r.review_text||'Без текста')+'</p>'+reply+
    '<div class="muted small" style="margin-top:10px">Статус отзыва: '+esc(r.reply_state||'NONE')+
    ' · Наблюдалось: '+esc(dateText(r.observed_at))+'</div></div>';
}
client.auth.onAuthStateChange(e=>{if(e==='PASSWORD_RECOVERY'){clearAuthUrl(true);showRecovery()}if(e==='SIGNED_IN'){const recovery=new URLSearchParams(location.search).get('recovery')==='1';clearAuthUrl(recovery);if(recovery)showRecovery();else setTimeout(enterAdmin,0)}});(async()=>{const recovery=new URLSearchParams(location.search).get('recovery')==='1';const {data:{session}}=await client.auth.getSession();if(session){clearAuthUrl(recovery);return recovery?showRecovery():enterAdmin()}showAuth()})();
</script></body></html>
