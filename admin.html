<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Мясной Батя — Админка Review Activator</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--dark:#0B1113;--accent:#00C7B7;--surface:#F6F8F9;--text:#1F2933;--muted:#6B7280;--border:#DDE3E6;--success:#16A34A;--danger:#DC2626;--warning:#F59E0B}*{box-sizing:border-box}body{margin:0;font:16px/1.45 Inter,Arial,sans-serif;background:var(--surface);color:var(--text)}button,input,select,textarea{font:inherit}.top{min-height:64px;background:var(--dark);color:#fff;display:flex;align-items:center;padding:0 18px;gap:12px}.brand{font-weight:700;flex:1}.wrap{max-width:1180px;margin:32px auto;padding:0 16px}.card,.review{background:#fff;border:1px solid var(--border);border-radius:20px;padding:20px;margin-bottom:16px}.auth{max-width:520px;margin:56px auto}.field{margin:12px 0}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}input,select,textarea{width:100%;min-height:52px;border:1px solid var(--border);border-radius:12px;padding:12px;background:#fff}textarea{min-height:110px}.btn{min-height:48px;border-radius:12px;border:1px solid transparent;padding:11px 14px;font-weight:700;cursor:pointer}.btn:disabled{opacity:.55;cursor:not-allowed}.primary{background:var(--accent);color:#063c36}.light{background:#fff;border-color:var(--border)}.muted{color:var(--muted)}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.grow{flex:1}.hidden{display:none!important}.notice{border-radius:14px;padding:12px 14px;margin:12px 0}.info{background:#EFF6FF;border:1px solid #BFDBFE;color:#1E3A8A}.ok{background:#DCFCE7;border:1px solid #BBF7D0;color:#166534}.bad{background:#FEE2E2;border:1px solid #FECACA;color:#991B1B}.pill,.platform{font-size:12px;font-weight:700;padding:5px 8px;border-radius:999px;background:#EFF6FF;color:#1E3A8A}.tabs{display:flex;gap:8px;margin:14px 0}.tabs button{flex:1}.small{font-size:13px}.filters{display:grid;grid-template-columns:1.3fr 1fr 1fr auto;gap:10px;align-items:end}.review{border-radius:18px;margin-top:12px}.reviewHead{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.stars{font-weight:800;color:#92400E}.replyBox{margin-top:14px;padding-top:14px;border-top:1px solid var(--border)}@media(max-width:780px){.filters{grid-template-columns:1fr}.row .btn{width:100%}.wrap{padding:0 12px}}</style></head><body><header class="top"><div class="brand">Мясной Батя · Review Activator</div><span class="small">ADMIN DEV</span></header><main class="wrap"><section id="authView" class="auth card"><h1>Вход в личный кабинет</h1><p class="muted">Первый вход можно выполнить через письмо на рабочую почту. После входа создайте собственный пароль.</p><div class="tabs"><button id="passwordTab" class="btn primary" onclick="setMode('password')">Пароль</button><button id="emailTab" class="btn light" onclick="setMode('email')">Вход по почте</button></div><div class="field"><label>Email</label><input id="email" type="email" value="Myasnoibatya@yandex.ru"></div><div id="passwordBlock"><div class="field"><label>Пароль</label><input id="password" type="password"></div><button class="btn primary" style="width:100%" onclick="loginPassword()">Войти</button><button class="btn light" style="width:100%;margin-top:8px" onclick="forgotPassword()">Забыли пароль?</button></div><div id="emailBlock" class="hidden"><button class="btn primary" style="width:100%" onclick="sendMagicLink()">Получить ссылку на почту</button></div><div id="authMsg"></div></section><section id="recoveryView" class="auth card hidden"><h1>Новый пароль</h1><div class="field"><label>Новый пароль</label><input id="recoveryPassword" type="password"></div><div class="field"><label>Повторите пароль</label><input id="recoveryPassword2" type="password"></div><button class="btn primary" onclick="finishRecovery()">Сохранить новый пароль</button><div id="recoveryMsg"></div></section><section id="adminView" class="hidden"><div class="card row"><div class="grow"><h1 style="margin:0">Личный кабинет</h1><div class="muted" id="profileText"></div></div><span class="pill" id="rolePill">—</span><button class="btn light" onclick="logout()">Выйти</button></div><div class="card"><div class="row"><div class="grow"><h2 style="margin:0">Отзывы</h2><div class="muted small">Яндекс · Асбест DEV · только чтение</div></div><button class="btn light" onclick="loadReviews()">Обновить</button></div><div class="filters"><div class="field"><label>Площадка</label><select id="fProvider"><option value="yandex">Яндекс</option></select></div><div class="field"><label>Оценка</label><select id="fRating"><option value="">Все</option><option value="low">1–3 ★</option><option value="high">4–5 ★</option></select></div><div class="field"><label>Ответ</label><select id="fAnswer"><option value="">Все</option><option value="unanswered">Без ответа</option></select></div><button class="btn primary" onclick="loadReviews()">Применить</button></div><div id="reviewsState" class="notice info">Загрузка отзывов…</div><div id="reviewsList"></div><div id="reviewsPager" class="row" style="justify-content:space-between;margin-top:12px"></div></div><div class="card"><h2>Пароль</h2><div class="field"><label>Новый пароль</label><input id="newPassword" type="password"></div><div class="field"><label>Повторите пароль</label><input id="newPassword2" type="password"></div><button class="btn primary" onclick="changePassword()">Сохранить пароль</button><div id="passwordMsg"></div></div></section></main><script>
const SUPABASE_URL='https://ykiubttldgyjpajmsuas.supabase.co',SUPABASE_KEY='sb_publishable_JoMwOnfv-S3MQ5Kr9QKFCQ_NBgvm0fY';const client=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});const ASBEST_SCOPE=Object.freeze({companyId:'13f3cb80-487a-4a19-96a1-fb3103200230',locationId:'9a95f63b-18e6-447b-a449-8530b67ddbae',externalLocationId:'54309413522',provider:'yandex',label:'Асбест · Ленинградская 41А'});const REVIEW_PAGE_SIZE=20;let reviewOffset=0;function esc(s=''){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function msg(id,t,type='info'){document.getElementById(id).innerHTML=`<div class="notice ${type}">${esc(t)}</div>`}function setMode(v){passwordBlock.classList.toggle('hidden',v!=='password');emailBlock.classList.toggle('hidden',v!=='email');passwordTab.className='btn '+(v==='password'?'primary':'light');emailTab.className='btn '+(v==='email'?'primary':'light')}function valid(a,b){return a.length<10?'Пароль должен быть не короче 10 символов.':a!==b?'Пароли не совпадают.':null}
async function loginPassword(){const {error}=await client.auth.signInWithPassword({email:email.value.trim().toLowerCase(),password:password.value});if(error)return msg('authMsg','Не удалось войти. Проверьте email и пароль.','bad');enterAdmin()}async function sendMagicLink(){const {error}=await client.auth.signInWithOtp({email:email.value.trim().toLowerCase(),options:{emailRedirectTo:location.origin+'/admin'}});msg('authMsg',error?'Не удалось отправить письмо.':'Письмо отправлено.',error?'bad':'ok')}async function forgotPassword(){const {error}=await client.auth.resetPasswordForEmail(email.value.trim().toLowerCase(),{redirectTo:location.origin+'/admin?recovery=1'});msg('authMsg',error?'Не удалось отправить письмо восстановления.':'Ссылка восстановления отправлена на почту.',error?'bad':'ok')}async function claimAndProfile(){let x=await client.rpc('review_admin_profile');if(!x.error&&x.data?.length)return x.data[0];await client.rpc('review_claim_initial_owner');x=await client.rpc('review_admin_profile');if(x.error||!x.data?.length)throw Error();return x.data[0]}async function enterAdmin(){try{const {data:{session}}=await client.auth.getSession();if(!session)return showAuth();const p=await claimAndProfile();authView.classList.add('hidden');recoveryView.classList.add('hidden');adminView.classList.remove('hidden');profileText.textContent=p.email;rolePill.textContent=p.role;loadReviews()}catch{await client.auth.signOut();showAuth();msg('authMsg','У этого аккаунта нет доступа к админке.','bad')}}function showAuth(){adminView.classList.add('hidden');recoveryView.classList.add('hidden');authView.classList.remove('hidden')}function showRecovery(){authView.classList.add('hidden');adminView.classList.add('hidden');recoveryView.classList.remove('hidden')}async function logout(){await client.auth.signOut();showAuth()}async function changePassword(){const e=valid(newPassword.value,newPassword2.value);if(e)return msg('passwordMsg',e,'bad');const {error}=await client.auth.updateUser({password:newPassword.value});msg('passwordMsg',error?'Не удалось сменить пароль.':'Пароль сохранён.',error?'bad':'ok')}async function finishRecovery(){const e=valid(recoveryPassword.value,recoveryPassword2.value);if(e)return msg('recoveryMsg',e,'bad');const {error}=await client.auth.updateUser({password:recoveryPassword.value});if(error)return msg('recoveryMsg','Не удалось сохранить пароль.','bad');enterAdmin()}
function stars(n){n=Math.max(0,Math.min(5,Number(n)||0));return'★'.repeat(n)+'☆'.repeat(5-n)}function dateText(v){if(!v)return'—';const d=new Date(v);return Number.isNaN(d.getTime())?'—':d.toLocaleString('ru-RU',{dateStyle:'medium',timeStyle:'short'})}function renderPager(total){const pager=document.getElementById('reviewsPager');if(!pager)return;const hasPrev=reviewOffset>0,hasNext=reviewOffset+REVIEW_PAGE_SIZE<total;pager.innerHTML=total>REVIEW_PAGE_SIZE?'<button class="btn light" '+(hasPrev?'':'disabled')+' onclick="reviewOffset=Math.max(0,reviewOffset-REVIEW_PAGE_SIZE);loadReviews(false)">Назад</button><span class="muted small">Страница '+(Math.floor(reviewOffset/REVIEW_PAGE_SIZE)+1)+' из '+Math.ceil(total/REVIEW_PAGE_SIZE)+'</span><button class="btn light" '+(hasNext?'':'disabled')+' onclick="reviewOffset=reviewOffset+REVIEW_PAGE_SIZE;loadReviews(false)">Вперёд</button>':''}async function loadReviews(reset=true){if(reset)reviewOffset=0;reviewsState.className='notice info';reviewsState.textContent='Загрузка отзывов…';reviewsList.innerHTML='';const pager=document.getElementById('reviewsPager');if(pager)pager.innerHTML='';const rating=fRating.value;const {data,error}=await client.rpc('review_admin_reviews_scoped',{p_company_id:ASBEST_SCOPE.companyId,p_location_id:ASBEST_SCOPE.locationId,p_external_location_id:ASBEST_SCOPE.externalLocationId,p_provider:ASBEST_SCOPE.provider,p_rating_min:rating==='high'?4:null,p_rating_max:rating==='low'?3:null,p_unanswered_only:fAnswer.value==='unanswered',p_limit:REVIEW_PAGE_SIZE,p_offset:reviewOffset});if(error){reviewsState.className='notice bad';reviewsState.textContent='Не удалось загрузить отзывы. Проверьте права администратора.';return}const rows=Array.isArray(data)?data:[];const total=Number(rows[0]?.total_count||0);const unanswered=Number(rows[0]?.unanswered_count||0);if(!rows.length){reviewsState.className='notice info';reviewsState.textContent='Отзывов по выбранным фильтрам пока нет.';renderPager(0);return}const from=reviewOffset+1,to=Math.min(reviewOffset+rows.length,total);reviewsState.className='notice ok';reviewsState.textContent='Показано '+from+'–'+to+' из '+total+' · Без ответа: '+unanswered;reviewsList.innerHTML=rows.map(renderReview).join('');renderPager(total)}function renderReview(r){const hasReply=Boolean(r.owner_reply_text);const reply=hasReply?'<div class="notice ok"><b>Ответ компании</b><div>'+esc(r.owner_reply_text)+'</div><div class="muted small">'+esc(dateText(r.owner_replied_at))+'</div></div>':'<div class="notice info"><b>Без ответа</b></div><textarea disabled readonly placeholder="Ответы отключены на этом этапе"></textarea>';return'<div class="review"><div class="reviewHead"><span class="platform">Яндекс</span><span class="stars">'+stars(r.rating)+'</span><b>'+esc(r.author_name||'Гость')+'</b><span class="muted small">'+esc(r.location_name||ASBEST_SCOPE.label)+'</span><span class="muted small">'+esc(dateText(r.published_at))+'</span></div><p>'+esc(r.review_text||'Без текста')+'</p>'+reply+'<div class="muted small" style="margin-top:10px">Статус: '+esc(r.reply_state||'NONE')+' · Наблюдалось: '+esc(dateText(r.observed_at))+'</div></div>'}client.auth.onAuthStateChange(e=>{if(e==='PASSWORD_RECOVERY')showRecovery();if(e==='SIGNED_IN'&&new URLSearchParams(location.search).get('recovery')!=='1')setTimeout(enterAdmin,0)});(async()=>{if(new URLSearchParams(location.search).get('recovery')==='1')return showRecovery();const {data:{session}}=await client.auth.getSession();session?enterAdmin():showAuth()})();
client.auth.onAuthStateChange(e=>{if(e==='PASSWORD_RECOVERY')showRecovery();if(e==='SIGNED_IN'&&new URLSearchParams(location.search).get('recovery')!=='1')setTimeout(enterAdmin,0)});(async()=>{if(new URLSearchParams(location.search).get('recovery')==='1')return showRecovery();const {data:{session}}=await client.auth.getSession();session?enterAdmin():showAuth()})();
</script></body></html>
