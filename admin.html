<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Мясной Батя — Админка Review Activator</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--dark:#0B1113;--accent:#00C7B7;--surface:#F6F8F9;--text:#1F2933;--muted:#6B7280;--border:#DDE3E6;--success:#16A34A;--danger:#DC2626;--warning:#F59E0B}*{box-sizing:border-box}body{margin:0;font:16px/1.45 Inter,Arial,sans-serif;background:var(--surface);color:var(--text)}button,input,select,textarea{font:inherit}.top{min-height:64px;background:var(--dark);color:#fff;display:flex;align-items:center;padding:0 18px;gap:12px}.brand{font-weight:700;flex:1}.wrap{max-width:1180px;margin:32px auto;padding:0 16px}.card,.review{background:#fff;border:1px solid var(--border);border-radius:20px;padding:20px;margin-bottom:16px}.auth{max-width:520px;margin:56px auto}.field{margin:12px 0}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}input,select,textarea{width:100%;min-height:52px;border:1px solid var(--border);border-radius:12px;padding:12px;background:#fff}textarea{min-height:110px}.btn{min-height:48px;border-radius:12px;border:1px solid transparent;padding:11px 14px;font-weight:700;cursor:pointer}.btn:disabled{opacity:.55;cursor:not-allowed}.primary{background:var(--accent);color:#063c36}.light{background:#fff;border-color:var(--border)}.muted{color:var(--muted)}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.grow{flex:1}.hidden{display:none!important}.notice{border-radius:14px;padding:12px 14px;margin:12px 0}.info{background:#EFF6FF;border:1px solid #BFDBFE;color:#1E3A8A}.ok{background:#DCFCE7;border:1px solid #BBF7D0;color:#166534}.bad{background:#FEE2E2;border:1px solid #FECACA;color:#991B1B}.pill,.platform{font-size:12px;font-weight:700;padding:5px 8px;border-radius:999px;background:#EFF6FF;color:#1E3A8A}.tabs{display:flex;gap:8px;margin:14px 0}.tabs button{flex:1}.small{font-size:13px}.filters{display:grid;grid-template-columns:1.3fr 1fr 1fr auto;gap:10px;align-items:end}.review{border-radius:18px;margin-top:12px}.reviewHead{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.stars{font-weight:800;color:#92400E}.replyBox{margin-top:14px;padding-top:14px;border-top:1px solid var(--border)}@media(max-width:780px){.filters{grid-template-columns:1fr}.row .btn{width:100%}.wrap{padding:0 12px}}</style></head><body><header class="top"><div class="brand">Мясной Батя · Review Activator</div><span class="small">ADMIN DEV</span></header><main class="wrap"><section id="authView" class="auth card"><h1>Вход в личный кабинет</h1><p class="muted">Первый вход можно выполнить через письмо на рабочую почту. После входа создайте собственный пароль.</p><div class="tabs"><button id="passwordTab" class="btn primary" onclick="setMode('password')">Пароль</button><button id="emailTab" class="btn light" onclick="setMode('email')">Вход по почте</button></div><div class="field"><label>Email</label><input id="email" type="email" value="Myasnoibatya@yandex.ru"></div><div id="passwordBlock"><div class="field"><label>Пароль</label><input id="password" type="password"></div><button class="btn primary" style="width:100%" onclick="loginPassword()">Войти</button><button class="btn light" style="width:100%;margin-top:8px" onclick="forgotPassword()">Забыли пароль?</button></div><div id="emailBlock" class="hidden"><button class="btn primary" style="width:100%" onclick="sendMagicLink()">Получить ссылку на почту</button></div><div id="authMsg"></div></section><section id="recoveryView" class="auth card hidden"><h1>Новый пароль</h1><div class="field"><label>Новый пароль</label><input id="recoveryPassword" type="password"></div><div class="field"><label>Повторите пароль</label><input id="recoveryPassword2" type="password"></div><button class="btn primary" onclick="finishRecovery()">Сохранить новый пароль</button><div id="recoveryMsg"></div></section><section id="adminView" class="hidden"><div class="card row"><div class="grow"><h1 style="margin:0">Личный кабинет</h1><div class="muted" id="profileText"></div></div><span class="pill" id="rolePill">—</span><button class="btn light" onclick="logout()">Выйти</button></div><div class="card"><div class="row"><div class="grow"><h2 style="margin:0">Отзывы</h2><div class="muted small">Яндекс и 2ГИС · AI создаёт только черновик</div></div><button class="btn light" onclick="loadReviews()">Обновить</button></div><div class="filters"><div class="field"><label>Площадка</label><select id="fProvider"><option value="">Все</option><option value="yandex">Яндекс</option><option value="2gis">2ГИС</option></select></div><div class="field"><label>Оценка</label><select id="fRating"><option value="">Все</option><option value="low">1–3 ★</option><option value="high">4–5 ★</option></select></div><div class="field"><label>Ответ</label><select id="fAnswer"><option value="">Все</option><option value="unanswered">Без ответа</option></select></div><button class="btn primary" onclick="loadReviews()">Применить</button></div><div id="reviewsState" class="notice info">Загрузка отзывов…</div><div id="reviewsList"></div></div><div class="card"><h2>Пароль</h2><div class="field"><label>Новый пароль</label><input id="newPassword" type="password"></div><div class="field"><label>Повторите пароль</label><input id="newPassword2" type="password"></div><button class="btn primary" onclick="changePassword()">Сохранить пароль</button><div id="passwordMsg"></div></div></section></main><script>
const SUPABASE_URL='https://ykiubttldgyjpajmsuas.supabase.co',SUPABASE_KEY='sb_publishable_JoMwOnfv-S3MQ5Kr9QKFCQ_NBgvm0fY';const client=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});function esc(s=''){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function msg(id,t,type='info'){document.getElementById(id).innerHTML=`<div class="notice ${type}">${esc(t)}</div>`}function setMode(v){passwordBlock.classList.toggle('hidden',v!=='password');emailBlock.classList.toggle('hidden',v!=='email');passwordTab.className='btn '+(v==='password'?'primary':'light');emailTab.className='btn '+(v==='email'?'primary':'light')}function valid(a,b){return a.length<10?'Пароль должен быть не короче 10 символов.':a!==b?'Пароли не совпадают.':null}
async function loginPassword(){const {error}=await client.auth.signInWithPassword({email:email.value.trim().toLowerCase(),password:password.value});if(error)return msg('authMsg','Не удалось войти. Проверьте email и пароль.','bad');enterAdmin()}async function sendMagicLink(){const {error}=await client.auth.signInWithOtp({email:email.value.trim().toLowerCase(),options:{emailRedirectTo:location.origin+'/admin'}});msg('authMsg',error?'Не удалось отправить письмо.':'Письмо отправлено.',error?'bad':'ok')}async function forgotPassword(){const {error}=await client.auth.resetPasswordForEmail(email.value.trim().toLowerCase(),{redirectTo:location.origin+'/admin?recovery=1'});msg('authMsg',error?'Не удалось отправить письмо восстановления.':'Ссылка восстановления отправлена на почту.',error?'bad':'ok')}async function claimAndProfile(){let x=await client.rpc('review_admin_profile');if(!x.error&&x.data?.length)return x.data[0];await client.rpc('review_claim_initial_owner');x=await client.rpc('review_admin_profile');if(x.error||!x.data?.length)throw Error();return x.data[0]}async function enterAdmin(){try{const {data:{session}}=await client.auth.getSession();if(!session)return showAuth();const p=await claimAndProfile();authView.classList.add('hidden');recoveryView.classList.add('hidden');adminView.classList.remove('hidden');profileText.textContent=p.email;rolePill.textContent=p.role;loadReviews()}catch{await client.auth.signOut();showAuth();msg('authMsg','У этого аккаунта нет доступа к админке.','bad')}}function showAuth(){adminView.classList.add('hidden');recoveryView.classList.add('hidden');authView.classList.remove('hidden')}function showRecovery(){authView.classList.add('hidden');adminView.classList.add('hidden');recoveryView.classList.remove('hidden')}async function logout(){await client.auth.signOut();showAuth()}async function changePassword(){const e=valid(newPassword.value,newPassword2.value);if(e)return msg('passwordMsg',e,'bad');const {error}=await client.auth.updateUser({password:newPassword.value});msg('passwordMsg',error?'Не удалось сменить пароль.':'Пароль сохранён.',error?'bad':'ok')}async function finishRecovery(){const e=valid(recoveryPassword.value,recoveryPassword2.value);if(e)return msg('recoveryMsg',e,'bad');const {error}=await client.auth.updateUser({password:recoveryPassword.value});if(error)return msg('recoveryMsg','Не удалось сохранить пароль.','bad');enterAdmin()}
function stars(n){n=Math.max(0,Math.min(5,Number(n)||0));return'★'.repeat(n)+'☆'.repeat(5-n)}async function loadReviews(){reviewsState.className='notice info';reviewsState.textContent='Загрузка отзывов…';reviewsList.innerHTML='';const rating=fRating.value,{data,error}=await client.rpc('review_admin_reviews',{p_provider:fProvider.value||null,p_rating_min:rating==='high'?4:null,p_rating_max:rating==='low'?3:null,p_unanswered_only:fAnswer.value==='unanswered',p_limit:100});if(error){reviewsState.className='notice bad';reviewsState.textContent='Не удалось загрузить отзывы. Повторите.';return}if(!data?.length){reviewsState.className='notice info';reviewsState.textContent='Отзывов по выбранным фильтрам пока нет.';return}reviewsState.classList.add('hidden');reviewsList.innerHTML=data.map(renderReview).join('')}function renderReview(r){return `<div class="review"><div class="reviewHead"><span class="platform">${esc(r.provider==='yandex'?'Яндекс':'2ГИС')}</span><span class="stars">${stars(r.rating)}</span><b>${esc(r.author_name||'Гость')}</b><span class="muted small">${esc(r.location_name||'Точка')}</span></div><p>${esc(r.review_text||'Без текста')}</p><div class="replyBox">${r.owner_reply_text?`<div class="notice ok">${esc(r.owner_reply_text)}</div>`:`<textarea id="reply_${r.id}" placeholder="Напишите ответ или используйте AI-черновик"></textarea><div id="ai_${r.id}"></div><div class="row" style="margin-top:8px"><button id="aibtn_${r.id}" class="btn light" onclick="aiDraft('${r.id}')">Предложить ответ AI</button><button class="btn primary" onclick="saveDraft('${r.id}','human',null)">Сохранить черновик</button><button class="btn light" disabled>Опубликовать</button></div>`}</div></div>`}async function saveDraft(id,source='human',model=null){const text=document.getElementById('reply_'+id)?.value.trim();if(!text)return;const {error}=await client.rpc('review_admin_save_reply_draft',{p_external_review_row_id:id,p_reply_text:text,p_draft_source:source,p_ai_model:model});if(error)throw error;return true}
async function aiDraft(id){const btn=document.getElementById('aibtn_'+id),box=document.getElementById('ai_'+id),ta=document.getElementById('reply_'+id);btn.disabled=true;btn.textContent='AI готовит ответ…';box.innerHTML='<div class="notice info">Готовим черновик. Он не будет опубликован автоматически.</div>';try{const {data:{session}}=await client.auth.getSession();if(!session)throw Error('AUTH');const r=await fetch('/api/admin-review-reply-draft',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+session.access_token},body:JSON.stringify({reviewRowId:id})});const d=await r.json();if(!r.ok||!d.ok||!d.draft)throw Error(d.error||'AI');ta.value=d.draft;await saveDraft(id,'ai',d.model||null);box.innerHTML='<div class="notice ok">AI-черновик готов и сохранён. Проверьте текст перед будущей публикацией.</div>'}catch(e){box.innerHTML='<div class="notice bad">Не удалось подготовить AI-ответ. Проверьте настройку AI и повторите.</div>'}finally{btn.disabled=false;btn.textContent='Предложить ответ AI'}}
client.auth.onAuthStateChange(e=>{if(e==='PASSWORD_RECOVERY')showRecovery();if(e==='SIGNED_IN'&&new URLSearchParams(location.search).get('recovery')!=='1')setTimeout(enterAdmin,0)});(async()=>{if(new URLSearchParams(location.search).get('recovery')==='1')return showRecovery();const {data:{session}}=await client.auth.getSession();session?enterAdmin():showAuth()})();
</script></body></html>
