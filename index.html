<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Мясной Батя — Активатор отзывов DEV v0.7</title>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.4/build/qrcode.min.js"></script>
<style>
:root{--dark:#0B1113;--dark2:#111A1E;--accent:#00C7B7;--accent2:#2EE6D3;--surface:#F6F8F9;--text:#1F2933;--muted:#6B7280;--border:#DDE3E6;--success:#16A34A;--warn:#F59E0B;--danger:#DC2626;--info:#2563EB;--r12:12px;--r16:16px;--r20:20px;--r24:24px;--ctrl:52px}
*{box-sizing:border-box}body{margin:0;font:16px/1.45 Inter,Arial,sans-serif;background:var(--surface);color:var(--text)}button,input,textarea,select{font:inherit}.hidden{display:none!important}.top{height:64px;background:var(--dark);color:#fff;display:flex;align-items:center;padding:0 18px;gap:12px;position:sticky;top:0;z-index:20}.brand{font-weight:700;flex:1;display:flex;align-items:center;gap:10px}.mark{width:28px;height:28px;border:6px solid #fff;border-right-color:var(--accent);border-bottom-color:var(--accent);border-radius:50%}.badge{font-size:12px;color:var(--accent2);border:1px solid rgba(46,230,211,.3);border-radius:999px;padding:6px 10px}.top button{border:1px solid rgba(255,255,255,.18);background:transparent;color:#fff;border-radius:12px;padding:9px 13px;cursor:pointer}.top button.active{background:var(--accent);color:#063c36;border-color:var(--accent)}
.client{min-height:calc(100vh - 64px);padding:22px;display:flex;justify-content:center}.phone{width:390px;min-height:760px;background:#fff;border:1px solid var(--border);border-radius:24px;overflow:hidden}.screen{min-height:758px;padding:26px 22px;display:flex;flex-direction:column;background:linear-gradient(#fff,var(--surface))}.logo{width:74px;height:74px;background:var(--dark);color:#fff;border-radius:20px;display:grid;place-items:center;margin:12px auto 8px;font-size:13px;font-weight:700}.center{text-align:center}.muted{color:var(--muted)}.card{background:#fff;border:1px solid var(--border);border-radius:20px;padding:22px}.moods{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}.mood{min-height:150px;border:1px solid var(--border);border-radius:20px;background:#fff;font-size:58px;cursor:pointer}.mood span{display:block;font-size:15px;font-weight:700}.mood.good{background:#F0FDF4;border-color:#BBF7D0}.mood.bad{background:#FEF2F2;border-color:#FECACA}.btn{min-height:48px;border-radius:12px;border:1px solid transparent;padding:11px 14px;font-weight:700;cursor:pointer}.primary{background:var(--accent);color:#063c36}.light{background:#fff;border-color:var(--border)}.danger{background:#FEF2F2;color:#991B1B;border-color:#FECACA}.platform{width:100%;min-height:58px;margin:7px 0;border:1px solid var(--border);background:#fff;border-radius:16px;padding:12px 14px;text-align:left;font-weight:700;cursor:pointer}.gift{background:#FFFBEB;border:1px solid #FDE68A;border-radius:16px;padding:14px;text-align:center;color:#92400E;font-weight:700}.reasonGrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.reason{border:1px solid var(--border);background:#fff;border-radius:12px;padding:10px;cursor:pointer}.reason.sel{border:2px solid var(--accent);background:#ECFEFF}.field{margin:11px 0}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:5px}input,textarea,select{width:100%;min-height:52px;border:1px solid var(--border);border-radius:12px;padding:12px;background:#fff}textarea{min-height:106px}.space{flex:1}.foot{font-size:12px;color:var(--muted);text-align:center;margin-top:22px}
.admin{min-height:calc(100vh - 64px)}.layout{display:grid;grid-template-columns:250px 1fr;min-height:calc(100vh - 64px)}.side{background:var(--dark);padding:22px 12px}.side h4{color:#fff;margin:0 10px 14px;font-size:12px;letter-spacing:.08em}.tab{display:block;width:100%;text-align:left;min-height:46px;border-radius:12px;border:1px solid transparent;background:transparent;color:#C7D0D5;padding:10px 12px;margin:4px 0;font-weight:700;cursor:pointer}.tab.active{background:rgba(0,199,183,.14);border-color:rgba(0,199,183,.25);color:var(--accent2)}.work{padding:26px;max-width:1400px;width:100%;margin:auto}h1{font-size:30px;margin:0 0 18px}h2{font-size:19px;margin:0 0 12px}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}.c{background:#fff;border:1px solid var(--border);border-radius:20px;padding:18px}.s3{grid-column:span 3}.s6{grid-column:span 6}.s12{grid-column:span 12}.metric b{display:block;font-size:30px;margin-top:5px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.grow{flex:1}.pill{font-size:12px;font-weight:700;padding:5px 8px;border-radius:999px}.ok{background:#DCFCE7;color:#166534}.wait{background:#FEF3C7;color:#92400E}.off{background:#F3F4F6;color:#6B7280}.badP{background:#FEE2E2;color:#991B1B}.table{width:100%;border-collapse:collapse}.table th,.table td{border-bottom:1px solid var(--border);padding:11px 8px;text-align:left;font-size:14px;vertical-align:top}.table th{color:var(--muted)}.notice{background:#EFF6FF;border:1px solid #BFDBFE;color:#1E3A8A;border-radius:16px;padding:13px;margin-bottom:14px}.warnbox{background:#FFFBEB;border:1px solid #FDE68A;color:#92400E;border-radius:16px;padding:13px}.code{font:12px ui-monospace,Consolas,monospace;background:var(--surface);border:1px solid var(--border);padding:8px;border-radius:10px;word-break:break-all}.qrbox{display:grid;grid-template-columns:160px 1fr;gap:18px;align-items:start}.qr{width:150px;height:150px;background:#fff;border:1px solid var(--border);border-radius:12px;padding:8px}.small{font-size:13px}.toast{position:fixed;right:20px;bottom:20px;background:var(--dark);color:#fff;padding:12px 15px;border-radius:12px;z-index:99}
@media(max-width:900px){.layout{grid-template-columns:1fr}.side{display:flex;overflow:auto;padding:8px;position:sticky;top:64px;z-index:10}.side h4{display:none}.tab{white-space:nowrap;width:auto}.work{padding:14px}.s3,.s6{grid-column:span 12}.client{padding:0}.phone{width:100%;border-radius:0;border:0}.badge{display:none}.qrbox{grid-template-columns:1fr}.qr{margin:auto}}
</style>
</head>
<body>
<header class="top"><div class="brand"><span class="mark"></span>Мясной Батя · Активатор отзывов</div><span class="badge">BUSINESS OS · DEV v0.7</span><button id="clientBtn" class="active">Клиент</button><button id="adminBtn">Админка</button></header>
<div id="client" class="client"></div><div id="admin" class="admin hidden"></div><div id="toast" class="toast hidden"></div>
<script>
const KEY='mb_review_v07';
const D={company:{name:'Мясной Батя',gift:'Соус в подарок',techEmail:'reviews@myasnoibatya.ru'},location:{name:'Мясной Батя',city:'Каменск-Уральский',address:'Тестовая торговая точка',token:'mb-dev-main',yandex:'https://yandex.ru/maps/',gis:'https://2gis.ru/'},promos:['BATYA-DEMO-001','BATYA-DEMO-002','BATYA-DEMO-003'],sessions:[],feedback:[],notifications:{telegramChat:'',emails:'',notifyTelegram:true,notifyEmail:true},connections:{yandex:false,gis:false},events:[]};
let db=load(),tab='overview',reason=null;
function load(){try{return Object.assign(structuredClone(D),JSON.parse(localStorage.getItem(KEY))||{})}catch{return structuredClone(D)}}function save(){localStorage.setItem(KEY,JSON.stringify(db))}function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function uid(p){return p+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}function toast(t){const x=document.getElementById('toast');x.textContent=t;x.classList.remove('hidden');setTimeout(()=>x.classList.add('hidden'),2200)}function evt(type,data={}){db.events.unshift({id:uid('e_'),type,at:new Date().toISOString(),...data});save()}
function clientHome(){document.getElementById('client').innerHTML=`<div class="phone"><div class="screen"><div class="center muted">Вы посетили</div><div class="logo">МЯСНОЙ<br>БАТЯ</div><div class="center"><b style="font-size:23px">${esc(db.location.name)}</b><div class="muted">${esc(db.location.city)} · ${esc(db.location.address)}</div></div><div style="height:34px"></div><div class="card"><div class="center" style="font-size:25px;font-weight:700">Вам понравилось?</div><div class="moods"><button class="mood good" onclick="positive()">😄<span>Понравилось</span></button><button class="mood bad" onclick="negative()">😞<span>Не понравилось</span></button></div></div><div class="space"></div><div class="foot">Мясной Батя · Активатор отзывов</div></div></div>`;evt('open')}
function positive(){document.getElementById('client').innerHTML=`<div class="phone"><div class="screen"><button class="btn light" onclick="clientHome()">← Назад</button><div style="height:26px"></div><div class="center" style="font-size:68px">🎁</div><h2 class="center" style="font-size:27px">Получите подарок за отзыв</h2><p class="center muted">Оставьте положительный отзыв. После публикации и проверки мы пришлём промокод на вашу почту.</p><div class="gift">${esc(db.company.gift)}</div><div class="field"><label>Email для получения промокода</label><input id="posEmail" type="email" placeholder="name@example.com"></div><button class="platform" onclick="goPlatform('yandex')">Яндекс Карты<br><span class="muted small">Оставить отзыв о точке</span></button><button class="platform" onclick="goPlatform('2gis')">2ГИС<br><span class="muted small">Оставить отзыв о точке</span></button><div class="space"></div><div class="foot">Промокод отправляется после подтверждения публикации.</div></div></div>`;evt('positive')}
async function goPlatform(p){const email=document.getElementById('posEmail').value.trim();if(!/^\S+@\S+\.\S+$/.test(email)){toast('Введите корректный email');return}try{const r=await fetch('/api/reward-request',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,platform:p,token:db.location.token})});const data=await r.json();if(!r.ok||!data.ok)throw new Error(data.error||'REQUEST_FAILED');const s={id:data.session.id,email,platform:p,createdAt:data.session.createdAt,status:data.session.status,confidence:null,promo:null,persisted:true};db.sessions.unshift(s);evt('platform_click',{sessionId:s.id,platform:p});save();window.open(p==='yandex'?db.location.yandex:db.location.gis,'_blank');document.getElementById('client').innerHTML=`<div class="phone"><div class="screen"><div class="center" style="font-size:72px;margin-top:70px">❤️</div><h2 class="center" style="font-size:28px">Спасибо!</h2><p class="center muted">Заявка сохранена. Как только публикация будет подтверждена, промокод придёт на <b>${esc(email)}</b>.</p><div class="notice">Статус заявки: ожидаем публикацию.</div><button class="btn primary" onclick="clientHome()">Готово</button><div class="space"></div><div class="foot">DEV: заявка уже хранится в отдельной базе Review Activator.</div></div></div>`}catch(e){toast('Не удалось сохранить заявку. Попробуйте ещё раз.')}}
function negative(){reason=null;document.getElementById('client').innerHTML=`<div class="phone"><div class="screen"><button class="btn light" onclick="clientHome()">← Назад</button><h2 class="center" style="font-size:28px;margin-top:24px">Нам жаль</h2><p class="center muted">Расскажите, пожалуйста, что случилось. Мы хотим это исправить.</p><div class="reasonGrid">${['Еда','Долгое ожидание','Ошибка в заказе','Обслуживание','Чистота','Цена','Другое'].map(x=>`<button class="reason" onclick="pickReason(this,'${x}')">${x}</button>`).join('')}</div><div class="field"><label>Комментарий</label><textarea id="negText" placeholder="Что произошло?"></textarea></div><div class="field"><label>Телефон или email — необязательно</label><input id="negContact" placeholder="Для обратной связи"></div><button class="btn primary" onclick="sendNegative()">Отправить</button><div class="space"></div><div class="foot">Сообщение сохраняется и затем дублируется администратору.</div></div></div>`}
function pickReason(el,r){reason=r;document.querySelectorAll('.reason').forEach(x=>x.classList.remove('sel'));el.classList.add('sel')}
async function sendNegative(){const text=document.getElementById('negText').value.trim(),contact=document.getElementById('negContact').value.trim();if(!reason){toast('Выберите причину');return}if(!text){toast('Напишите, что случилось');return}try{const r=await fetch('/api/feedback',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:db.location.token,reason,text,contact})});const data=await r.json();if(!r.ok||!data.ok)throw new Error(data.error||'REQUEST_FAILED');const f={id:data.feedbackId||uid('fb_'),reason,text,contact,at:new Date().toISOString(),status:'new',telegram:data.delivery?.telegram||'not_configured',email:data.delivery?.email||'not_configured',persisted:true};db.feedback.unshift(f);evt('negative_feedback',{feedbackId:f.id});save();document.getElementById('client').innerHTML=`<div class="phone"><div class="screen"><div class="center" style="font-size:72px;margin-top:80px">🙏</div><h2 class="center" style="font-size:28px">Спасибо</h2><p class="center muted">Сообщение сохранено. Мы обязательно разберёмся.</p><button class="btn primary" onclick="clientHome()">Готово</button><div class="space"></div><div class="foot">DEV: обращение уже хранится в отдельной базе Review Activator.</div></div></div>`}catch(e){toast('Не удалось отправить сообщение. Попробуйте ещё раз.')}}
function stats(){return{opens:db.events.filter(e=>e.type==='open').length,pos:db.events.filter(e=>e.type==='positive').length,neg:db.feedback.length,waiting:db.sessions.filter(s=>s.status==='WAITING_PUBLICATION').length}}
function showAdmin(){document.getElementById('client').classList.add('hidden');document.getElementById('admin').classList.remove('hidden');renderAdmin()}
function renderAdmin(){const tabs=[['overview','Обзор'],['qr','Точки и QR'],['rewards','Бонусы и промокоды'],['verify','Проверка отзывов'],['notify','Уведомления'],['connect','Подключения']];document.getElementById('admin').innerHTML=`<div class="layout"><aside class="side"><h4>АКТИВАТОР ОТЗЫВОВ</h4>${tabs.map(([k,n])=>`<button class="tab ${tab===k?'active':''}" onclick="tab='${k}';renderAdmin()">${n}</button>`).join('')}</aside><main class="work" id="work"></main></div>`;({overview,qr,rewards,verify,notify,connect}[tab]||overview)()}
function overview(){const s=stats();document.getElementById('work').innerHTML=`<h1>Обзор</h1><div class="notice">v0.7 Supabase Foundation. Клиентские заявки и негатив уже сохраняются в отдельной серверной базе Review Activator; админские списки пока зеркалятся локально для DEV.</div><div class="grid">${[['Открытия',s.opens],['Положительные',s.pos],['Негатив',s.neg],['Ожидают публикации',s.waiting]].map(x=>`<div class="c s3 metric"><span class="muted">${x[0]}</span><b>${x[1]}</b></div>`).join('')}<div class="c s6"><h2>Промокоды</h2><div class="row"><div class="grow"><b style="font-size:30px">${db.promos.length}</b><div class="muted">доступно в локальном DEV-пуле</div></div><button class="btn primary" onclick="tab='rewards';renderAdmin()">Управлять</button></div></div><div class="c s6"><h2>Backend</h2><div>Supabase <span class="pill ok">Подключено</span></div><div style="margin-top:8px">Telegram <span class="pill off">Следующий этап</span></div><div style="margin-top:8px">Email <span class="pill off">Следующий этап</span></div></div></div>`}
function qr(){document.getElementById('work').innerHTML=`<h1>Точки и QR</h1><div class="c"><div class="qrbox"><canvas id="qrc" class="qr"></canvas><div><h2>${esc(db.location.city)} · ${esc(db.location.address)}</h2><div class="muted">Основной QR точки</div><div class="code" id="qrurl"></div><div class="row" style="margin-top:12px"><button class="btn primary" onclick="downloadQR()">Скачать PNG</button><button class="btn light" onclick="downloadSvg()">Скачать SVG</button><button class="btn light" onclick="copyQR()">Скопировать ссылку</button></div></div></div></div>`;const url=location.origin+location.pathname+'?token='+encodeURIComponent(db.location.token);document.getElementById('qrurl').textContent=url;QRCode.toCanvas(document.getElementById('qrc'),url,{width:134,margin:1},()=>{})}
function downloadQR(){const c=document.getElementById('qrc'),a=document.createElement('a');a.download='myasnoy-batya-review-qr.png';a.href=c.toDataURL('image/png');a.click()}function downloadSvg(){const url=document.getElementById('qrurl').textContent;QRCode.toString(url,{type:'svg',margin:1},(err,svg)=>{if(err){toast('Не удалось создать SVG');return}const a=document.createElement('a');a.download='myasnoy-batya-review-qr.svg';a.href=URL.createObjectURL(new Blob([svg],{type:'image/svg+xml'}));a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)})}function copyQR(){navigator.clipboard.writeText(document.getElementById('qrurl').textContent);toast('Ссылка скопирована')}
function rewards(){document.getElementById('work').innerHTML=`<h1>Бонусы и промокоды</h1><div class="grid"><div class="c s6"><h2>Пул промокодов</h2><div class="row"><div class="grow"><b style="font-size:34px">${db.promos.length}</b><div class="muted">доступно</div></div><span class="pill ${db.promos.length>10?'ok':db.promos.length?'wait':'badP'}">${db.promos.length>10?'Норма':db.promos.length?'Заканчиваются':'Закончились'}</span></div><div class="field"><label>Загрузить ZIP с codes.csv или codes.txt</label><input id="zipInput" type="file" accept=".zip"></div><button class="btn primary" onclick="importZip()">Импортировать ZIP</button><div id="zipResult" class="small muted" style="margin-top:10px"></div></div><div class="c s6"><h2>Правила выдачи</h2><div class="field"><label>Подарок</label><input id="gift" value="${esc(db.company.gift)}" onchange="db.company.gift=this.value;save()"></div><div class="notice">Код выдаётся только после подтверждения опубликованного внешнего отзыва.</div><div class="warnbox">Серверный импорт пула будет следующим подэтапом. Пока ZIP-пул редактируется локально в DEV-интерфейсе.</div></div><div class="c s12"><h2>Последние коды</h2><div class="code">${db.promos.slice(0,30).map(esc).join(' · ')||'Пул пуст'}</div></div></div>`}
async function importZip(){const f=document.getElementById('zipInput').files[0];if(!f){toast('Выберите ZIP');return}try{const z=await JSZip.loadAsync(f);const names=Object.keys(z.files).filter(n=>/codes\.(csv|txt)$/i.test(n));if(!names.length)throw new Error('В ZIP нет codes.csv или codes.txt');const raw=await z.files[names[0]].async('string');const arr=raw.split(/\r?\n/).map(x=>x.trim()).filter(Boolean).map(x=>x.split(/[;,]/)[0].trim()).filter(x=>x&&!/^code$/i.test(x));const before=db.promos.length,seen=new Set(db.promos);let dups=0;arr.forEach(c=>seen.has(c)?dups++:seen.add(c));db.promos=[...seen];save();document.getElementById('zipResult').textContent=`Найдено: ${arr.length}. Добавлено: ${db.promos.length-before}. Дубликатов: ${dups}.`;toast('Промокоды импортированы');setTimeout(()=>renderAdmin(),650)}catch(e){document.getElementById('zipResult').textContent='Ошибка: '+e.message}}
function verify(){document.getElementById('work').innerHTML=`<h1>Проверка отзывов</h1><div class="notice">Foundation: YandexBusinessProvider / TwoGisBusinessProvider будут создавать кандидатов автоматически. Сейчас проверку можно симулировать вручную.</div><div class="c"><table class="table"><thead><tr><th>Email</th><th>Площадка</th><th>Создано</th><th>Статус</th><th>Действия</th></tr></thead><tbody>${db.sessions.map(s=>`<tr><td>${esc(s.email)}</td><td>${s.platform}</td><td>${new Date(s.createdAt).toLocaleString('ru-RU')}</td><td><span class="pill ${s.status==='WAITING_PUBLICATION'||s.status==='CANDIDATE'?'wait':'ok'}">${s.status}</span></td><td>${s.status==='WAITING_PUBLICATION'?`<button class="btn light" onclick="simulateMatch('${s.id}')">Найден отзыв</button>`:''}${s.status==='CANDIDATE'?`<button class="btn primary" onclick="confirmReview('${s.id}')">Подтвердить</button> <button class="btn danger" onclick="rejectReview('${s.id}')">Не тот</button>`:''}</td></tr>`).join('')||'<tr><td colspan="5" class="muted">Пока нет заявок.</td></tr>'}</tbody></table></div>`}
function simulateMatch(id){const s=db.sessions.find(x=>x.id===id);if(!s)return;s.status='CANDIDATE';s.confidence=92;save();toast('Кандидат найден · confidence 92%');renderAdmin()}
function confirmReview(id){const s=db.sessions.find(x=>x.id===id);if(!s)return;s.status='VERIFIED';if(db.promos.length){s.promo=db.promos.shift();s.status='PROMO_SENT';s.sentAt=new Date().toISOString();toast('Промокод назначен и поставлен в очередь email')}else{s.status='WAITING_PROMO';toast('Отзыв подтверждён, но промокоды закончились')}save();renderAdmin()}
function rejectReview(id){const s=db.sessions.find(x=>x.id===id);if(s){s.status='WAITING_PUBLICATION';s.confidence=null;save();renderAdmin()}}
function notify(){document.getElementById('work').innerHTML=`<h1>Уведомления о негативе</h1><div class="grid"><div class="c s6"><h2>Telegram</h2><div class="field"><label>Chat ID / получатель</label><input value="${esc(db.notifications.telegramChat)}" onchange="db.notifications.telegramChat=this.value;save()" placeholder="Будет задан на следующем этапе"></div><label><input style="width:auto;min-height:auto" type="checkbox" ${db.notifications.notifyTelegram?'checked':''} onchange="db.notifications.notifyTelegram=this.checked;save()"> Отправлять каждый негатив в Telegram</label></div><div class="c s6"><h2>Email</h2><div class="field"><label>Email получателей</label><input value="${esc(db.notifications.emails)}" onchange="db.notifications.emails=this.value;save()" placeholder="admin@example.com"></div><label><input style="width:auto;min-height:auto" type="checkbox" ${db.notifications.notifyEmail?'checked':''} onchange="db.notifications.notifyEmail=this.checked;save()"> Дублировать негатив на email</label></div><div class="c s12"><h2>Последние обращения в этом браузере</h2><table class="table"><thead><tr><th>Время</th><th>Причина</th><th>Комментарий</th><th>Контакт</th><th>Telegram</th><th>Email</th></tr></thead><tbody>${db.feedback.map(f=>`<tr><td>${new Date(f.at).toLocaleString('ru-RU')}</td><td>${esc(f.reason)}</td><td>${esc(f.text)}</td><td>${esc(f.contact||'—')}</td><td>${f.telegram}</td><td>${f.email}</td></tr>`).join('')||'<tr><td colspan="6" class="muted">Обращений пока нет.</td></tr>'}</tbody></table></div></div>`}
function connect(){document.getElementById('work').innerHTML=`<h1>Подключения</h1><div class="grid"><div class="c s6"><div class="row"><h2 class="grow">Яндекс Бизнес</h2><span class="pill ${db.connections.yandex?'ok':'off'}">${db.connections.yandex?'Подключено':'Не подключено'}</span></div><p class="muted">Сеть → Доступы → Добавить → роль «Представитель».</p><div class="code">Технический аккаунт: ${esc(db.company.techEmail)}</div><button class="btn primary" style="margin-top:12px" onclick="db.connections.yandex=!db.connections.yandex;save();renderAdmin()">${db.connections.yandex?'Отключить DEMO':'Отметить подключённым'}</button></div><div class="c s6"><div class="row"><h2 class="grow">2ГИС</h2><span class="pill ${db.connections.gis?'ok':'off'}">${db.connections.gis?'Подключено':'Не подключено'}</span></div><p class="muted">Мой профиль → Управление доступом → Пригласить пользователя.</p><div class="code">Технический аккаунт: ${esc(db.company.techEmail)}</div><button class="btn primary" style="margin-top:12px" onclick="db.connections.gis=!db.connections.gis;save();renderAdmin()">${db.connections.gis?'Отключить DEMO':'Отметить подключённым'}</button></div><div class="c s12"><h2>Как будет работать мониторинг</h2><div class="code">Business account access → Review Provider Adapter → new review candidate → Matching Engine → VERIFIED → Promo Pool → email клиенту</div><p class="muted small">Способ чтения новых отзывов из авторизованных кабинетов ещё не зафиксирован: выбираем официальный/доступный канал после технической проверки реальных кабинетов.</p></div></div>`}
document.getElementById('clientBtn').onclick=()=>{document.getElementById('admin').classList.add('hidden');document.getElementById('client').classList.remove('hidden');document.getElementById('clientBtn').classList.add('active');document.getElementById('adminBtn').classList.remove('active');clientHome()};document.getElementById('adminBtn').onclick=()=>{document.getElementById('adminBtn').classList.add('active');document.getElementById('clientBtn').classList.remove('active');showAdmin()};
clientHome();
</script>
</body></html>
