<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Мясной Батя — Активатор отзывов DEV v0.8</title>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.4/build/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{--dark:#0B1113;--dark2:#111A1E;--accent:#00C7B7;--accent2:#2EE6D3;--surface:#F6F8F9;--text:#1F2933;--muted:#6B7280;--border:#DDE3E6;--success:#16A34A;--warning:#F59E0B;--danger:#DC2626;--r12:12px;--r16:16px;--r20:20px;--r24:24px}
*{box-sizing:border-box}body{margin:0;font:16px/1.45 Inter,Arial,sans-serif;background:var(--surface);color:var(--text)}button,input,textarea{font:inherit}.hidden{display:none!important}.top{height:64px;background:var(--dark);color:#fff;display:flex;align-items:center;padding:0 18px;gap:12px;position:sticky;top:0;z-index:20}.brand{font-weight:700;flex:1;display:flex;align-items:center;gap:10px}.mark{width:28px;height:28px;border:6px solid #fff;border-right-color:var(--accent);border-bottom-color:var(--accent);border-radius:50%}.badge{font-size:12px;color:var(--accent2);border:1px solid rgba(46,230,211,.3);border-radius:999px;padding:6px 10px}.top button{border:1px solid rgba(255,255,255,.18);background:transparent;color:#fff;border-radius:12px;padding:9px 13px;cursor:pointer}.top button.active{background:var(--accent);color:#063c36;border-color:var(--accent)}
.client{min-height:calc(100vh - 64px);padding:22px;display:flex;justify-content:center}.phone{width:390px;min-height:760px;background:#fff;border:1px solid var(--border);border-radius:24px;overflow:hidden}.screen{min-height:758px;padding:26px 22px;display:flex;flex-direction:column;background:linear-gradient(#fff,var(--surface))}.logo{width:74px;height:74px;background:var(--dark);color:#fff;border-radius:20px;display:grid;place-items:center;margin:12px auto 8px;font-size:13px;font-weight:700}.center{text-align:center}.muted{color:var(--muted)}.card{background:#fff;border:1px solid var(--border);border-radius:20px;padding:22px}.moods{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}.mood{min-height:150px;border:1px solid var(--border);border-radius:20px;background:#fff;font-size:58px;cursor:pointer}.mood span{display:block;font-size:15px;font-weight:700}.good{background:#F0FDF4;border-color:#BBF7D0}.bad{background:#FEF2F2;border-color:#FECACA}.btn{min-height:48px;border-radius:12px;border:1px solid transparent;padding:11px 14px;font-weight:700;cursor:pointer}.primary{background:var(--accent);color:#063c36}.light{background:#fff;border-color:var(--border)}.danger{background:#FEF2F2;color:#991B1B;border-color:#FECACA}.platform{width:100%;min-height:58px;margin:7px 0;border:1px solid var(--border);background:#fff;border-radius:16px;padding:12px 14px;text-align:left;font-weight:700;cursor:pointer}.gift{background:#FFFBEB;border:1px solid #FDE68A;border-radius:16px;padding:14px;text-align:center;color:#92400E;font-weight:700}.reasonGrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.reason{border:1px solid var(--border);background:#fff;border-radius:12px;padding:10px;cursor:pointer}.reason.sel{border:2px solid var(--accent);background:#ECFEFF}.field{margin:11px 0}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:5px}input,textarea{width:100%;min-height:52px;border:1px solid var(--border);border-radius:12px;padding:12px;background:#fff}textarea{min-height:106px}.space{flex:1}.foot{font-size:12px;color:var(--muted);text-align:center;margin-top:22px}
.admin{min-height:calc(100vh - 64px)}.layout{display:grid;grid-template-columns:250px 1fr;min-height:calc(100vh - 64px)}.side{background:var(--dark);padding:22px 12px}.side h4{color:#fff;margin:0 10px 14px;font-size:12px;letter-spacing:.08em}.tab{display:block;width:100%;text-align:left;min-height:46px;border-radius:12px;border:1px solid transparent;background:transparent;color:#C7D0D5;padding:10px 12px;margin:4px 0;font-weight:700;cursor:pointer}.tab.active{background:rgba(0,199,183,.14);border-color:rgba(0,199,183,.25);color:var(--accent2)}.work{padding:26px;max-width:1400px;width:100%;margin:auto}h1{font-size:30px;margin:0 0 18px}h2{font-size:19px;margin:0 0 12px}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}.c{background:#fff;border:1px solid var(--border);border-radius:20px;padding:18px}.s3{grid-column:span 3}.s6{grid-column:span 6}.s12{grid-column:span 12}.metric b{display:block;font-size:30px;margin-top:5px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.grow{flex:1}.pill{font-size:12px;font-weight:700;padding:5px 8px;border-radius:999px}.ok{background:#DCFCE7;color:#166534}.wait{background:#FEF3C7;color:#92400E}.off{background:#F3F4F6;color:#6B7280}.badP{background:#FEE2E2;color:#991B1B}.table{width:100%;border-collapse:collapse}.table th,.table td{border-bottom:1px solid var(--border);padding:11px 8px;text-align:left;font-size:14px;vertical-align:top}.table th{color:var(--muted)}.notice{background:#EFF6FF;border:1px solid #BFDBFE;color:#1E3A8A;border-radius:16px;padding:13px;margin-bottom:14px}.warnbox{background:#FFFBEB;border:1px solid #FDE68A;color:#92400E;border-radius:16px;padding:13px}.code{font:12px ui-monospace,Consolas,monospace;background:var(--surface);border:1px solid var(--border);padding:8px;border-radius:10px;word-break:break-all}.qrbox{display:grid;grid-template-columns:160px 1fr;gap:18px;align-items:start}.qr{width:150px;height:150px;background:#fff;border:1px solid var(--border);border-radius:12px;padding:8px}.small{font-size:13px}.toast{position:fixed;right:20px;bottom:20px;background:var(--dark);color:#fff;padding:12px 15px;border-radius:12px;z-index:99}.promoStats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0}.promoStats div{border:1px solid var(--border);border-radius:12px;padding:12px;background:var(--surface)}.promoStats b{display:block;font-size:24px}
@media(max-width:900px){.layout{grid-template-columns:1fr}.side{display:flex;overflow:auto;padding:8px;position:sticky;top:64px;z-index:10}.side h4{display:none}.tab{white-space:nowrap;width:auto}.work{padding:14px}.s3,.s6{grid-column:span 12}.client{padding:0}.phone{width:100%;border-radius:0;border:0}.badge{display:none}.qrbox{grid-template-columns:1fr}.qr{margin:auto}.promoStats{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<header class="top"><div class="brand"><span class="mark"></span>Мясной Батя · Активатор отзывов</div><span class="badge">BUSINESS OS · DEV v0.8</span><button id="clientBtn" class="active">Клиент</button><button id="adminBtn">Админка</button></header>
<div id="client" class="client"></div><div id="admin" class="admin hidden"></div><div id="toast" class="toast hidden"></div>
<script>
const KEY='mb_review_v08';
const D={company:{name:'Мясной Батя',gift:'Соус в подарок',techEmail:'reviews@myasnoibatya.ru'},location:{name:'Мясной Батя',city:'Каменск-Уральский',address:'Тестовая торговая точка',token:'mb-dev-main',yandex:'https://yandex.ru/maps/',gis:'https://2gis.ru/'},sessions:[],feedback:[],notifications:{telegramChat:'',emails:'',notifyTelegram:true,notifyEmail:true},connections:{yandex:false,gis:false},events:[]};
let db=load(),tab='overview',reason=null;
function load(){try{return Object.assign(structuredClone(D),JSON.parse(localStorage.getItem(KEY))||{})}catch{return structuredClone(D)}}function save(){localStorage.setItem(KEY,JSON.stringify(db))}function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function uid(p){return p+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}function toast(t){const x=document.getElementById('toast');x.textContent=t;x.classList.remove('hidden');setTimeout(()=>x.classList.add('hidden'),2400)}function evt(type,data={}){db.events.unshift({id:uid('e_'),type,at:new Date().toISOString(),...data});save()}
function clientHome(){document.getElementById('client').innerHTML=`<div class="phone"><div class="screen"><div class="center muted">Вы посетили</div><div class="logo">МЯСНОЙ<br>БАТЯ</div><div class="center"><b style="font-size:23px">${esc(db.location.name)}</b><div class="muted">${esc(db.location.city)} · ${esc(db.location.address)}</div></div><div style="height:34px"></div><div class="card"><div class="center" style="font-size:25px;font-weight:700">Вам понравилось?</div><div class="moods"><button class="mood good" onclick="positive()">😄<span>Понравилось</span></button><button class="mood bad" onclick="negative()">😞<span>Не понравилось</span></button></div></div><div class="space"></div><div class="foot">Мясной Батя · Активатор отзывов</div></div></div>`;evt('open')}
function positive(){document.getElementById('client').innerHTML=`<div class="phone"><div class="screen"><button class="btn light" onclick="clientHome()">← Назад</button><div style="height:26px"></div><div class="center" style="font-size:68px">🎁</div><h2 class="center" style="font-size:27px">Получите подарок за отзыв</h2><p class="center muted">Оставьте положительный отзыв. После публикации и проверки мы пришлём промокод на вашу почту.</p><div class="gift">${esc(db.company.gift)}</div><div class="field"><label>Email для получения промокода</label><input id="posEmail" type="email" placeholder="name@example.com"></div><button class="platform" onclick="goPlatform('yandex')">Яндекс Карты<br><span class="muted small">Оставить отзыв о точке</span></button><button class="platform" onclick="goPlatform('2gis')">2ГИС<br><span class="muted small">Оставить отзыв о точке</span></button><div class="space"></div><div class="foot">Промокод отправляется после подтверждения публикации.</div></div></div>`;evt('positive')}
async function goPlatform(p){const email=document.getElementById('posEmail').value.trim();if(!/^\S+@\S+\.\S+$/.test(email)){toast('Введите корректный email');return}try{const r=await fetch('/api/reward-request',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,platform:p,token:db.location.token})});const data=await r.json();if(!r.ok||!data.ok)throw new Error();const s={id:data.session.id,email,platform:p,createdAt:data.session.createdAt,status:data.session.status};db.sessions.unshift(s);save();window.open(p==='yandex'?db.location.yandex:db.location.gis,'_blank');document.getElementById('client').innerHTML=`<div class="phone"><div class="screen"><div class="center" style="font-size:72px;margin-top:70px">❤️</div><h2 class="center" style="font-size:28px">Спасибо!</h2><p class="center muted">Заявка сохранена. После подтверждения публикации промокод придёт на <b>${esc(email)}</b>.</p><div class="notice">Статус: ожидаем публикацию.</div><button class="btn primary" onclick="clientHome()">Готово</button><div class="space"></div><div class="foot">Заявка хранится в отдельной базе Review Activator.</div></div></div>`}catch{toast('Не удалось сохранить заявку. Попробуйте ещё раз.')}}
function negative(){reason=null;document.getElementById('client').innerHTML=`<div class="phone"><div class="screen"><button class="btn light" onclick="clientHome()">← Назад</button><h2 class="center" style="font-size:28px;margin-top:24px">Нам жаль</h2><p class="center muted">Расскажите, пожалуйста, что случилось. Мы хотим это исправить.</p><div class="reasonGrid">${['Еда','Долгое ожидание','Ошибка в заказе','Обслуживание','Чистота','Цена','Другое'].map(x=>`<button class="reason" onclick="pickReason(this,'${x}')">${x}</button>`).join('')}</div><div class="field"><label>Комментарий</label><textarea id="negText" placeholder="Что произошло?"></textarea></div><div class="field"><label>Телефон или email — необязательно</label><input id="negContact" placeholder="Для обратной связи"></div><button class="btn primary" onclick="sendNegative()">Отправить</button><div class="space"></div></div></div>`}
function pickReason(el,r){reason=r;document.querySelectorAll('.reason').forEach(x=>x.classList.remove('sel'));el.classList.add('sel')}
async function sendNegative(){const text=document.getElementById('negText').value.trim(),contact=document.getElementById('negContact').value.trim();if(!reason)return toast('Выберите причину');if(!text)return toast('Напишите, что случилось');try{const r=await fetch('/api/feedback',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:db.location.token,reason,text,contact})});const data=await r.json();if(!r.ok||!data.ok)throw new Error();db.feedback.unshift({id:data.feedbackId||uid('fb_'),reason,text,contact,at:new Date().toISOString()});save();document.getElementById('client').innerHTML=`<div class="phone"><div class="screen"><div class="center" style="font-size:72px;margin-top:80px">🙏</div><h2 class="center" style="font-size:28px">Спасибо</h2><p class="center muted">Сообщение сохранено. Мы обязательно разберёмся.</p><button class="btn primary" onclick="clientHome()">Готово</button><div class="space"></div></div></div>`}catch{toast('Не удалось отправить сообщение.')}}
function stats(){return{opens:db.events.filter(e=>e.type==='open').length,pos:db.events.filter(e=>e.type==='positive').length,neg:db.feedback.length,waiting:db.sessions.filter(s=>s.status==='WAITING_PUBLICATION').length}}
async function getPromoStats(){try{const r=await fetch('/api/promo-stats?token='+encodeURIComponent(db.location.token),{cache:'no-store'});const d=await r.json();if(!r.ok||!d.ok)throw new Error();return d.pool}catch{return null}}
function showAdmin(){document.getElementById('client').classList.add('hidden');document.getElementById('admin').classList.remove('hidden');renderAdmin()}
function renderAdmin(){const tabs=[['overview','Обзор'],['qr','Точки и QR'],['rewards','Бонусы и промокоды'],['verify','Проверка отзывов'],['notify','Уведомления'],['connect','Подключения']];document.getElementById('admin').innerHTML=`<div class="layout"><aside class="side"><h4>АКТИВАТОР ОТЗЫВОВ</h4>${tabs.map(([k,n])=>`<button class="tab ${tab===k?'active':''}" onclick="tab='${k}';renderAdmin()">${n}</button>`).join('')}</aside><main class="work" id="work"></main></div>`;({overview,qr,rewards,verify,notify,connect}[tab]||overview)()}
async function overview(){const s=stats();document.getElementById('work').innerHTML=`<h1>Обзор</h1><div class="notice">v0.8 Server Promo Pool. Клиентские заявки, негатив и пул промокодов находятся в отдельном Supabase Review Activator.</div><div class="grid">${[['Открытия',s.opens],['Положительные',s.pos],['Негатив',s.neg],['Ожидают публикации',s.waiting]].map(x=>`<div class="c s3 metric"><span class="muted">${x[0]}</span><b>${x[1]}</b></div>`).join('')}<div class="c s6"><h2>Промокоды</h2><div id="overviewPromo" class="muted">Загружаю серверный остаток…</div></div><div class="c s6"><h2>Backend</h2><div>Supabase <span class="pill ok">Подключено</span></div><div style="margin-top:8px">Telegram <span class="pill off">Следующий этап</span></div><div style="margin-top:8px">Email <span class="pill off">Следующий этап</span></div></div></div>`;const p=await getPromoStats();const el=document.getElementById('overviewPromo');if(el)el.innerHTML=p?`<b style="font-size:30px;color:var(--text)">${p.available}</b><div>доступно · ${p.reserved} зарезервировано · ${p.sent} отправлено</div>`:'Не удалось загрузить статистику'}
function qr(){document.getElementById('work').innerHTML=`<h1>Точки и QR</h1><div class="c"><div class="qrbox"><canvas id="qrc" class="qr"></canvas><div><h2>${esc(db.location.city)} · ${esc(db.location.address)}</h2><div class="muted">Основной QR точки</div><div class="code" id="qrurl"></div><div class="row" style="margin-top:12px"><button class="btn primary" onclick="downloadQR()">Скачать PNG</button><button class="btn light" onclick="downloadSvg()">Скачать SVG</button><button class="btn light" onclick="copyQR()">Скопировать ссылку</button></div></div></div></div>`;const url=location.origin+location.pathname+'?token='+encodeURIComponent(db.location.token);document.getElementById('qrurl').textContent=url;QRCode.toCanvas(document.getElementById('qrc'),url,{width:134,margin:1},()=>{})}
function downloadQR(){const c=document.getElementById('qrc'),a=document.createElement('a');a.download='myasnoy-batya-review-qr.png';a.href=c.toDataURL('image/png');a.click()}function downloadSvg(){const url=document.getElementById('qrurl').textContent;QRCode.toString(url,{type:'svg',margin:1},(err,svg)=>{if(err)return toast('Не удалось создать SVG');const a=document.createElement('a');a.download='myasnoy-batya-review-qr.svg';a.href=URL.createObjectURL(new Blob([svg],{type:'image/svg+xml'}));a.click()})}function copyQR(){navigator.clipboard.writeText(document.getElementById('qrurl').textContent);toast('Ссылка скопирована')}
async function rewards(){document.getElementById('work').innerHTML=`<h1>Бонусы и промокоды</h1><div class="grid"><div class="c s6"><h2>Серверный пул</h2><div id="promoStats" class="muted">Загружаю…</div><div class="field"><label>Загрузить XLSX / ZIP / CSV / TXT</label><input id="promoFile" type="file" accept=".xlsx,.xls,.zip,.csv,.txt"></div><button class="btn primary" onclick="importPromoFile()">Импортировать в Supabase</button><div id="importResult" class="small muted" style="margin-top:10px"></div></div><div class="c s6"><h2>Правила выдачи</h2><div class="field"><label>Подарок</label><input id="gift" value="${esc(db.company.gift)}" onchange="db.company.gift=this.value;save()"></div><div class="notice">Промокод резервируется на сервере атомарно только после подтверждения опубликованного отзыва.</div><div class="warnbox">DEV: импорт промокодов пока доступен без авторизации администратора. Перед production обязательно добавим Auth.</div></div></div>`;await refreshPromoStats()}
async function refreshPromoStats(){const p=await getPromoStats(),el=document.getElementById('promoStats');if(!el)return;if(!p){el.textContent='Не удалось загрузить статистику';return}el.innerHTML=`<div class="promoStats"><div><span class="muted small">Доступно</span><b>${p.available}</b></div><div><span class="muted small">Зарезервировано</span><b>${p.reserved}</b></div><div><span class="muted small">Отправлено</span><b>${p.sent}</b></div><div><span class="muted small">Использовано</span><b>${p.redeemed}</b></div></div>`}
function codesFromRows(rows){if(!rows.length)return[];const headers=Object.keys(rows[0]||{});const key=headers.find(h=>String(h).trim().toLowerCase()==='промокод')||headers.find(h=>/promo|code|код/i.test(h))||headers[0];return rows.map(r=>String(r[key]??'').trim()).filter(Boolean)}
function codesFromText(raw){return raw.split(/\r?\n/).map(x=>x.trim()).filter(Boolean).map((x,i)=>{if(i===0&&/^(промокод|promo.?code|code)$/i.test(x.replace(/["']/g,'')))return'';return x.split(/[;,\t]/)[0].replace(/^['"]|['"]$/g,'').trim()}).filter(Boolean)}
async function parsePromoFile(file){const n=file.name.toLowerCase();if(n.endsWith('.xlsx')||n.endsWith('.xls')){const wb=XLSX.read(await file.arrayBuffer(),{type:'array'});const ws=wb.Sheets[wb.SheetNames[0]];return codesFromRows(XLSX.utils.sheet_to_json(ws,{defval:''}))}if(n.endsWith('.csv')||n.endsWith('.txt'))return codesFromText(await file.text());if(n.endsWith('.zip')){const z=await JSZip.loadAsync(file);const names=Object.keys(z.files).filter(x=>/\.(xlsx|xls|csv|txt)$/i.test(x)&&!z.files[x].dir);if(!names.length)throw new Error('В ZIP нет XLSX/CSV/TXT');const name=names[0],entry=z.files[name];if(/\.xlsx?$/i.test(name)){const wb=XLSX.read(await entry.async('arraybuffer'),{type:'array'});return codesFromRows(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''}))}return codesFromText(await entry.async('string'))}throw new Error('Неподдерживаемый формат')}
async function importPromoFile(){const input=document.getElementById('promoFile'),out=document.getElementById('importResult'),file=input.files[0];if(!file)return toast('Выберите файл');out.textContent='Читаю файл…';try{const codes=await parsePromoFile(file);const unique=[...new Set(codes)].slice(0,5000);if(!unique.length)throw new Error('Промокоды не найдены');out.textContent=`Найдено ${codes.length}, отправляю ${unique.length} уникальных…`;const r=await fetch('/api/promo-import',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:db.location.token,codes:unique,rewardLabel:db.company.gift})});const d=await r.json();if(!r.ok||!d.ok)throw new Error(d.error||'IMPORT_FAILED');out.textContent=`Готово. Найдено: ${d.result.found}. Добавлено: ${d.result.added}. Дубликатов в базе: ${d.result.duplicates}.`;toast('Пул промокодов обновлён');await refreshPromoStats()}catch(e){out.textContent='Ошибка: '+e.message}}
function verify(){document.getElementById('work').innerHTML=`<h1>Проверка отзывов</h1><div class="notice">YandexBusinessProvider / TwoGisBusinessProvider будут создавать кандидатов автоматически. Сейчас DEV-очередь отображается из текущего браузера.</div><div class="c"><table class="table"><thead><tr><th>Email</th><th>Площадка</th><th>Создано</th><th>Статус</th></tr></thead><tbody>${db.sessions.map(s=>`<tr><td>${esc(s.email)}</td><td>${s.platform}</td><td>${new Date(s.createdAt).toLocaleString('ru-RU')}</td><td><span class="pill wait">${s.status}</span></td></tr>`).join('')||'<tr><td colspan="4" class="muted">Пока нет заявок в этом браузере.</td></tr>'}</tbody></table></div>`}
function notify(){document.getElementById('work').innerHTML=`<h1>Уведомления о негативе</h1><div class="grid"><div class="c s6"><h2>Telegram</h2><p class="muted">Следующий этап: реальная доставка администратору.</p></div><div class="c s6"><h2>Email</h2><p class="muted">Следующий этап: дублирование обращения на почту.</p></div><div class="c s12"><h2>Последние обращения в этом браузере</h2><table class="table"><tbody>${db.feedback.map(f=>`<tr><td>${new Date(f.at).toLocaleString('ru-RU')}</td><td>${esc(f.reason)}</td><td>${esc(f.text)}</td><td>${esc(f.contact||'—')}</td></tr>`).join('')||'<tr><td class="muted">Обращений пока нет.</td></tr>'}</tbody></table></div></div>`}
function connect(){document.getElementById('work').innerHTML=`<h1>Подключения</h1><div class="grid"><div class="c s6"><h2>Яндекс Бизнес</h2><p class="muted">Сеть → Доступы → Добавить → роль «Представитель».</p><div class="code">${esc(db.company.techEmail)}</div></div><div class="c s6"><h2>2ГИС</h2><p class="muted">Мой профиль → Управление доступом → Пригласить пользователя.</p><div class="code">${esc(db.company.techEmail)}</div></div><div class="c s12"><div class="code">Business account → Review Provider Adapter → Matching Engine → VERIFIED → Promo Pool → email клиенту</div></div></div>`}
document.getElementById('clientBtn').onclick=()=>{document.getElementById('admin').classList.add('hidden');document.getElementById('client').classList.remove('hidden');document.getElementById('clientBtn').classList.add('active');document.getElementById('adminBtn').classList.remove('active');clientHome()};document.getElementById('adminBtn').onclick=()=>{document.getElementById('adminBtn').classList.add('active');document.getElementById('clientBtn').classList.remove('active');showAdmin()};
clientHome();
