<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Мясной Батя — Активатор отзывов LOCAL DEMO v0.4</title>
<style>

:root{
  --brand-dark:#0B1113;--brand-dark-elevated:#111A1E;--brand-accent:#00C7B7;--brand-accent-alt:#2EE6D3;
  --brand-surface:#F6F8F9;--brand-text:#1F2933;--brand-muted:#6B7280;--brand-border:#DDE3E6;
  --success:#16A34A;--warning:#F59E0B;--danger:#DC2626;--info:#2563EB;
  --r-sm:12px;--r-md:16px;--r-lg:20px;--r-xl:24px;--control:52px;
  --shadow:0 10px 30px rgba(11,17,19,.08);
}
*{box-sizing:border-box}
html{background:var(--brand-surface)}
body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--brand-surface);color:var(--brand-text);font-size:16px;line-height:1.45}
button,input,textarea,select{font:inherit;color:inherit}.hidden{display:none!important}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid rgba(0,199,183,.28);outline-offset:2px}
.topbar{position:sticky;top:0;z-index:30;min-height:64px;background:var(--brand-dark);color:#fff;border-bottom:1px solid rgba(255,255,255,.08);display:flex;align-items:center;gap:12px;padding:8px 20px}
.brand{font-weight:700;font-size:18px;letter-spacing:.01em;flex:1;display:flex;align-items:center;gap:12px}.brand::before{content:"";width:28px;height:28px;border:6px solid #fff;border-right-color:var(--brand-accent);border-bottom-color:var(--brand-accent);border-radius:50%;display:inline-block}
.demo-badge{background:var(--brand-dark-elevated);color:var(--brand-accent-alt);border:1px solid rgba(46,230,211,.35);border-radius:999px;padding:7px 10px;font-size:12px;font-weight:600}
.topbtn{min-height:44px;border:1px solid rgba(255,255,255,.18);background:transparent;color:#fff;border-radius:var(--r-sm);padding:9px 14px;cursor:pointer;font-weight:600;transition:background 120ms cubic-bezier(.2,0,0,1),border-color 120ms cubic-bezier(.2,0,0,1)}
.topbtn:hover{background:var(--brand-dark-elevated)}.topbtn.active{background:var(--brand-accent);color:#062f2b;border-color:var(--brand-accent)}
.client-wrap{min-height:calc(100vh - 64px);display:flex;justify-content:center;align-items:flex-start;padding:24px;background:var(--brand-surface)}
.phone{width:390px;min-height:760px;background:#fff;border-radius:var(--r-xl);overflow:hidden;border:1px solid var(--brand-border);box-shadow:var(--shadow)}
.screen{min-height:758px;padding:28px 24px;display:flex;flex-direction:column;background:linear-gradient(180deg,#fff 0%,var(--brand-surface) 100%)}
.loc{text-align:center;font-size:14px;color:var(--brand-muted);font-weight:500}.logo{width:72px;height:72px;border-radius:var(--r-lg);background:var(--brand-dark);color:#fff;display:grid;place-items:center;margin:12px auto 8px;font-weight:700;font-size:13px;box-shadow:none;transform:none}.name{text-align:center;font-weight:700;font-size:24px}.addr{text-align:center;color:var(--brand-muted);margin:5px 0}.source{text-align:center;color:var(--brand-muted);font-size:12px;margin-bottom:20px}
.card{background:#fff;border:1px solid var(--brand-border);border-radius:var(--r-xl);padding:24px;box-shadow:none}.question{text-align:center;font-size:24px;font-weight:700}.moods{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}.mood{min-height:150px;border:1px solid var(--brand-border);border-radius:var(--r-lg);cursor:pointer;font-size:60px;transition:transform 120ms cubic-bezier(.2,0,0,1),border-color 120ms cubic-bezier(.2,0,0,1);background:#fff}.mood:hover{transform:translateY(-1px)}.good{background:#F0FDF4;border-color:#BBF7D0}.bad{background:#FEF2F2;border-color:#FECACA}.mood span{display:block;font-size:16px;font-weight:600;margin-top:6px}.good span{color:var(--success)}.bad span{color:var(--danger)}
.spacer{flex:1}.foot{text-align:center;color:var(--brand-muted);font-size:12px;padding-top:24px}.back{border:0;background:transparent;text-align:left;font-size:28px;cursor:pointer;width:44px;min-height:44px;padding:0;color:var(--brand-text)}.hero{text-align:center;font-size:72px;margin:48px 0 12px}.title{text-align:center;font-size:28px;font-weight:700}.subtitle{text-align:center;color:var(--brand-muted);line-height:1.5}.primary{min-height:var(--control);background:var(--brand-accent);border:0;color:#062f2b;font-weight:700;border-radius:var(--r-md);padding:14px 18px;cursor:pointer;width:100%;text-decoration:none;display:flex;align-items:center;justify-content:center}.platforms{display:grid;gap:12px;margin:24px 0}.platform{min-height:var(--control);padding:14px 16px;border-radius:var(--r-md);border:1px solid var(--brand-border);background:#fff;text-align:left;font-weight:600;cursor:pointer}.platform:hover{border-color:var(--brand-accent)}.platform small{display:block;color:var(--brand-muted);font-weight:400;margin-top:3px}.gift{margin:18px 0;background:#FFFBEB;border:1px solid #FDE68A;padding:16px;border-radius:var(--r-md);text-align:center;font-weight:600;color:#92400E}.reasons{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:17px 0}.reason{min-height:48px;border:1px solid var(--brand-border);background:#fff;padding:12px;border-radius:var(--r-sm);cursor:pointer}.reason.selected{border:2px solid var(--brand-accent);background:#ECFEFF}
textarea,input,select{width:100%;min-height:var(--control);border:1px solid var(--brand-border);border-radius:var(--r-sm);padding:13px 14px;margin:5px 0 9px;background:#fff}textarea{min-height:112px;resize:vertical}
.admin{max-width:none;margin:0;padding:0;background:var(--brand-surface);min-height:calc(100vh - 64px)}.admin-layout{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:calc(100vh - 64px)}.tabs{margin:0;background:var(--brand-dark);padding:24px 14px;display:flex;flex-direction:column;gap:6px;border-right:1px solid rgba(255,255,255,.06)}.tabs::before{content:"АКТИВАТОР ОТЗЫВОВ";color:#fff;font-size:12px;font-weight:700;letter-spacing:.08em;padding:0 10px 16px}.tab{width:100%;min-height:48px;border:1px solid transparent;background:transparent;color:#C7D0D5;border-radius:var(--r-sm);padding:11px 12px;font-weight:600;cursor:pointer;text-align:left}.tab:hover{background:var(--brand-dark-elevated);color:#fff}.tab.active{background:rgba(0,199,183,.14);color:var(--brand-accent-alt);border-color:rgba(0,199,183,.24)}.workspace{padding:28px;max-width:1440px;width:100%;margin:0 auto}.workspace>h1,.workspace>.row>h1{font-size:30px;font-weight:700;letter-spacing:-.02em}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}.a-card{background:#fff;border:1px solid var(--brand-border);border-radius:var(--r-lg);padding:20px;box-shadow:none}.s4{grid-column:span 4}.s6{grid-column:span 6}.s12{grid-column:span 12}.metric b{display:block;font-size:32px;margin-top:6px;font-weight:700}.muted{color:var(--brand-muted)}h1{margin:0 0 20px}h2{margin:0 0 12px;font-size:19px;font-weight:700}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.grow{flex:1}.btn{min-height:44px;border:1px solid transparent;border-radius:var(--r-sm);padding:10px 14px;font-weight:600;cursor:pointer}.red,.dark{background:var(--brand-accent);color:#062f2b}.green{background:#F0FDF4;color:#166534;border-color:#BBF7D0}.light{background:#fff;color:var(--brand-text);border-color:var(--brand-border)}.light:hover{border-color:var(--brand-accent)}.danger{background:#FEF2F2;color:#991B1B;border-color:#FECACA}.field{margin:12px 0}.field label{display:block;font-size:13px;color:var(--brand-text);margin-bottom:5px;font-weight:600}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;border-bottom:1px solid var(--brand-border);padding:12px 10px;font-size:14px;vertical-align:top}.table th{color:var(--brand-muted);font-weight:600}.notice{background:#EFF6FF;border:1px solid #BFDBFE;color:#1E3A8A;padding:14px 16px;border-radius:var(--r-md);margin-bottom:18px}.toast{position:fixed;right:20px;bottom:20px;background:var(--brand-dark);color:#fff;padding:13px 16px;border-radius:var(--r-sm);box-shadow:var(--shadow);z-index:50}.status{padding:5px 9px;border-radius:999px;font-size:12px;font-weight:600}.status.on{background:#DCFCE7;color:#166534}.status.off{background:#F3F4F6;color:#6B7280}.source-card{border:1px solid var(--brand-border);border-radius:var(--r-md);padding:14px;margin:10px 0;background:#fff}.mini-metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}.mini-metrics div{background:var(--brand-surface);border:1px solid var(--brand-border);border-radius:var(--r-sm);padding:9px;text-align:center;font-size:12px}.mini-metrics b{display:block;font-size:17px}.code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:11px;background:var(--brand-surface);border:1px solid var(--brand-border);padding:8px;border-radius:var(--r-sm);word-break:break-all}.fakeqr{width:126px;height:126px;display:grid;grid-template-columns:repeat(17,1fr);grid-template-rows:repeat(17,1fr);gap:1px;background:#fff;border:8px solid #fff;box-shadow:0 0 0 1px var(--brand-border);border-radius:var(--r-sm)}.fakeqr i{background:var(--brand-dark)}.fakeqr i.w{background:#fff}.location-head{display:grid;grid-template-columns:140px 1fr;gap:18px}.preview-mini{width:240px;height:430px;border:8px solid var(--brand-dark);border-radius:27px;overflow:hidden;background:var(--brand-surface);margin:auto;padding:16px;text-align:center}.preview-mini .pm-card{margin-top:80px;background:#fff;border:1px solid var(--brand-border);border-radius:var(--r-md);padding:18px;font-weight:700}.preview-mini .pm-moods{font-size:44px;margin-top:15px}.token-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.token-chip{border:1px solid var(--brand-border);border-radius:var(--r-md);padding:14px;background:#fff}.swatch{width:28px;height:28px;border-radius:8px;border:1px solid rgba(0,0,0,.08);display:inline-block;vertical-align:middle;margin-right:10px}.brand-lock{background:#ECFEFF;border:1px solid #A5F3FC;color:#155E75;padding:14px;border-radius:var(--r-md);margin-bottom:16px}
@media(max-width:900px){.admin-layout{grid-template-columns:1fr}.tabs{position:sticky;top:64px;z-index:20;flex-direction:row;overflow:auto;padding:8px;background:var(--brand-dark)}.tabs::before{display:none}.tab{width:auto;white-space:nowrap}.workspace{padding:16px}.s4,.s6{grid-column:span 12}.topbar{padding:8px 10px}.brand{font-size:14px}.demo-badge{display:none}.client-wrap{padding:8px}.phone{width:100%;border-radius:0;min-height:calc(100vh - 64px);box-shadow:none}.screen{min-height:calc(100vh - 64px)}.table{display:block;overflow:auto}.location-head{grid-template-columns:1fr}.fakeqr{margin:auto}.mini-metrics{grid-template-columns:repeat(2,1fr)}.token-grid{grid-template-columns:1fr}}

</style>
</head>
<body>
<header class="topbar"><div class="brand">Мясной Батя · Активатор отзывов</div><span class="demo-badge">BUSINESS OS · LOCAL v0.4</span><button id="showClient" class="topbtn active">Клиент</button><button id="showAdmin" class="topbtn">Админка</button></header>
<div id="clientRoot" class="client-wrap"></div><div id="adminRoot" class="admin hidden"></div><div id="toast" class="toast hidden"></div>
<script>
const KEY='mb_review_local_demo_v4';
const defaults={company:{name:'Мясной Батя',primary:'#00C7B7',background:'#F6F8F9',phone:'+7 900 000-00-00',email:'',gift:'Соус в подарок',bonus:true,texts:{question:'Вам понравилось?',positiveTitle:'Спасибо за оценку!',positiveOffer:'Оставьте положительный отзыв в геосервисе и получите подарок.',negativeTitle:'Нам жаль',negativeSubtitle:'Расскажите, пожалуйста, что случилось.'}},locations:[{id:'loc1',name:'Мясной Батя',city:'Каменск-Уральский',address:'Тестовая торговая точка',phone:'+7 900 000-00-00',active:true,yandex:'https://yandex.ru/maps/',gis:'https://2gis.ru/',sources:[{id:'src1',type:'location',label:'Основной QR точки',token:'demo-pobedy-75b',active:true},{id:'src2',type:'packaging',label:'QR на упаковке',token:'demo-packaging-01',active:true}]}],events:[],feedback:[]};
let db=load(),client={locationId:'loc1',sourceId:'src1',reason:null},tab='overview';
function clone(x){return JSON.parse(JSON.stringify(x))}function load(){try{return JSON.parse(localStorage.getItem(KEY))||clone(defaults)}catch{return clone(defaults)}}function save(){localStorage.setItem(KEY,JSON.stringify(db))}function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function id(p){return p+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}function token(){return 'mb-'+Math.random().toString(36).slice(2,10)+'-'+Math.random().toString(36).slice(2,7)}
function loc(){return db.locations.find(x=>x.id===client.locationId)||db.locations[0]}function src(){return loc()?.sources.find(x=>x.id===client.sourceId)||loc()?.sources[0]}function ev(type,payload={}){let l=loc(),s=src();if(!l||!s)return;db.events.push({id:id('ev'),type,payload,locationId:l.id,sourceId:s.id,at:new Date().toISOString()});save()}function toast(m){let e=document.querySelector('#toast');e.textContent=m;e.classList.remove('hidden');setTimeout(()=>e.classList.add('hidden'),1800)}
function localLink(s){return location.href.split('#')[0]+'#r='+encodeURIComponent(s.token)}function applyHash(){let m=location.hash.match(/^#r=(.+)$/);if(!m)return;let t=decodeURIComponent(m[1]);for(const l of db.locations){let s=l.sources.find(x=>x.token===t&&x.active);if(s&&l.active){client.locationId=l.id;client.sourceId=s.id;return}}}
function clientHeader(){let l=loc(),s=src();return `<div class="loc">Вы посетили</div><div class="logo">МЯСНОЙ<br>БАТЯ</div><div class="name">${esc(l.name)}</div><div class="addr">${esc(l.city)}, ${esc(l.address)}</div><div class="source">Источник: ${esc(s?.label||'Основной QR')}</div>`}
function renderQuestion(track=true){let l=loc(),s=src();if(!l||!s||!l.active||!s.active){clientRoot.innerHTML='<div class="phone"><section class="screen"><div class="hero">⛔</div><div class="title">Ссылка неактивна</div><p class="subtitle">Этот QR временно выключен.</p></section></div>';return}if(track)ev('open');clientRoot.innerHTML=`<div class="phone"><section class="screen">${clientHeader()}<div class="card"><div class="question">${esc(db.company.texts.question)}</div><div class="moods"><button class="mood good" onclick="positiveRate()">😄<span>Понравилось</span></button><button class="mood bad" onclick="negativeRate()">😞<span>Не понравилось</span></button></div></div><div class="spacer"></div><div class="foot">Мясной Батя · обратная связь</div></section></div>`}
window.positiveRate=()=>{ev('rating',{sentiment:'positive'});clientRoot.innerHTML=`<div class="phone"><section class="screen"><button class="back" onclick="renderQuestion(false)">←</button><div class="hero">🎉</div><div class="title">${esc(db.company.texts.positiveTitle)}</div><p class="subtitle">${esc(db.company.texts.positiveOffer)}</p>${db.company.bonus?`<div class="gift">🎁 ${esc(db.company.gift)}</div><p class="subtitle">После публикации отзыва покажите его сотруднику, чтобы получить подарок.</p>`:''}<div class="spacer"></div><button class="primary" onclick="renderPlatforms()">Продолжить</button><div class="foot">Мясной Батя · обратная связь</div></section></div>`};
window.renderPlatforms=()=>{clientRoot.innerHTML=`<div class="phone"><section class="screen"><button class="back" onclick="positiveRate()">←</button><div class="hero">❤️</div><div class="title">Где удобнее оставить отзыв?</div><p class="subtitle">Выберите площадку.</p><div class="platforms"><button class="platform" onclick="platform('yandex')">Яндекс Карты<small>Открыть карточку точки</small></button><button class="platform" onclick="platform('gis')">2ГИС<small>Открыть карточку точки</small></button></div><div class="spacer"></div><div class="foot">LOCAL DEMO: реальная площадка не открывается</div></section></div>`};
window.platform=p=>{ev('platform_click',{platform:p});toast((p==='yandex'?'Яндекс':'2ГИС')+': переход зафиксирован в DEMO');};
window.negativeRate=()=>{ev('rating',{sentiment:'negative'});client.reason=null;let reasons=['Еда','Долгое ожидание','Ошибка в заказе','Обслуживание','Чистота','Цена','Другое'];clientRoot.innerHTML=`<div class="phone"><section class="screen"><button class="back" onclick="renderQuestion(false)">←</button><div class="hero" style="margin-top:10px">😔</div><div class="title">${esc(db.company.texts.negativeTitle)}</div><p class="subtitle">${esc(db.company.texts.negativeSubtitle)}</p><div class="reasons">${reasons.map(r=>`<button class="reason" onclick="pickReason(this,'${r}')">${r}</button>`).join('')}</div><textarea id="negComment" placeholder="Расскажите подробнее"></textarea><input id="negContact" placeholder="Телефон для связи — необязательно"><div class="spacer"></div><button class="primary" onclick="sendNegative()">Отправить</button></section></div>`};
window.pickReason=(el,r)=>{document.querySelectorAll('.reason').forEach(x=>x.classList.remove('selected'));el.classList.add('selected');client.reason=r};window.sendNegative=()=>{if(!client.reason)return toast('Выберите, что случилось');let f={id:id('fb'),locationId:loc().id,sourceId:src().id,reason:client.reason,comment:negComment.value.trim(),contact:negContact.value.trim(),status:'new',at:new Date().toISOString()};db.feedback.push(f);ev('negative_feedback',{reason:f.reason});save();clientRoot.innerHTML=`<div class="phone"><section class="screen"><div class="hero">🙏</div><div class="title">Спасибо!</div><p class="subtitle">Мы получили сообщение и разберёмся в ближайшее время.</p><div class="spacer"></div><button class="primary" onclick="renderQuestion(false)">Готово</button></section></div>`};
function statFor(locationId=null,sourceId=null){let c={opens:0,ratings:0,positive:0,negative:0,yandex:0,gis:0};db.events.filter(e=>(!locationId||e.locationId===locationId)&&(!sourceId||e.sourceId===sourceId)).forEach(e=>{if(e.type==='open')c.opens++;if(e.type==='rating'){c.ratings++;e.payload.sentiment==='positive'?c.positive++:c.negative++}if(e.type==='platform_click'){e.payload.platform==='yandex'?c.yandex++:c.gis++}});return c}
function fakeQr(token){let seed=[...token].reduce((a,c)=>a+c.charCodeAt(0),0),html='';for(let i=0;i<289;i++){seed=(seed*9301+49297)%233280;let on=(seed/233280)>.5,x=i%17,y=Math.floor(i/17),finder=(x<5&&y<5)||(x>11&&y<5)||(x<5&&y>11);html+=`<i class="${on||finder?'':'w'}"></i>`}return `<div class="fakeqr">${html}</div>`}
function shell(content){adminRoot.innerHTML=`<div class="admin-layout"><aside class="tabs">${[['overview','Обзор'],['locations','Точки и QR'],['scenario','Сценарий'],['design','Оформление'],['settings','Настройки']].map(([i,n])=>`<button class="tab ${tab===i?'active':''}" onclick="setTab('${i}')">${n}</button>`).join('')}</aside><main class="workspace">${content}</main></div>`};window.setTab=t=>{tab=t;renderAdmin()};function renderAdmin(){({overview,locations,scenario,design,settings}[tab]||overview)()}
function overview(){let c=statFor();shell(`<div class="notice"><b>Локальная DEMO v0.4.</b> Интерфейс приведён к каноническому брендбуку Business OS. Статистика хранится только в этом браузере.</div><h1>Обзор</h1><div class="grid">${[['Открытия',c.opens],['Оценки',c.ratings],['Положительные',c.positive],['Негативные',c.negative],['Яндекс',c.yandex],['2ГИС',c.gis]].map(([n,v])=>`<div class="a-card s4 metric"><span class="muted">${n}</span><b>${v}</b></div>`).join('')}<div class="a-card s12"><h2>По точкам</h2><table class="table"><tr><th>Точка</th><th>Открытия</th><th>👍</th><th>👎</th><th>Яндекс</th><th>2ГИС</th></tr>${db.locations.map(l=>{let x=statFor(l.id);return `<tr><td>${esc(l.city)}, ${esc(l.address)}</td><td>${x.opens}</td><td>${x.positive}</td><td>${x.negative}</td><td>${x.yandex}</td><td>${x.gis}</td></tr>`}).join('')}</table></div><div class="a-card s12"><h2>Негативная обратная связь</h2>${feedbackTable()}</div></div>`)}
function feedbackTable(){if(!db.feedback.length)return `<p class="muted">Пока нет негативных обращений.</p>`;return `<table class="table"><tr><th>Время</th><th>Точка / QR</th><th>Причина</th><th>Комментарий</th><th>Контакт</th><th>Статус</th></tr>${db.feedback.slice().reverse().map(f=>{let l=db.locations.find(x=>x.id===f.locationId),s=l?.sources.find(x=>x.id===f.sourceId);return `<tr><td>${new Date(f.at).toLocaleString('ru-RU')}</td><td>${esc(l?.address||'')}<br><span class="muted">${esc(s?.label||'')}</span></td><td>${esc(f.reason)}</td><td>${esc(f.comment||'—')}</td><td>${esc(f.contact||'—')}</td><td><select onchange="feedbackStatus('${f.id}',this.value)"><option value="new" ${f.status==='new'?'selected':''}>Новый</option><option value="in_progress" ${f.status==='in_progress'?'selected':''}>В работе</option><option value="resolved" ${f.status==='resolved'?'selected':''}>Решено</option></select></td></tr>`}).join('')}</table>`};window.feedbackStatus=(i,s)=>{db.feedback.find(x=>x.id===i).status=s;save();toast('Статус обновлён')};
function sourceCard(l,s){let c=statFor(l.id,s.id),link=localLink(s);return `<div class="source-card"><div class="row"><span class="status ${s.active?'on':'off'}">${s.active?'Активен':'Выключен'}</span><b class="grow">${esc(s.label)}</b><span class="muted">${esc(s.type)}</span></div><div class="code">${esc(link)}</div><div class="mini-metrics"><div><b>${c.opens}</b>открытия</div><div><b>${c.positive}</b>👍</div><div><b>${c.negative}</b>👎</div><div><b>${c.yandex+c.gis}</b>переходы</div></div><div class="row" style="margin-top:10px"><button class="btn light" onclick="copySource('${s.id}','${l.id}')">Копировать ссылку</button><button class="btn dark" onclick="openSource('${l.id}','${s.id}')">Открыть как клиент</button><button class="btn light" onclick="toggleSource('${l.id}','${s.id}')">${s.active?'Выключить':'Включить'}</button>${s.type!=='location'?`<button class="btn danger" onclick="deleteSource('${l.id}','${s.id}')">Удалить</button>`:''}</div></div>`}
function locations(){shell(`<div class="row"><h1 class="grow">Точки и QR</h1><button class="btn red" onclick="addLocation()">+ Добавить точку</button></div><div class="notice"><b>v0.4:</b> одна точка → основной QR автоматически; дополнительные QR создаются для кассы, упаковки, чека, стола, доставки или кампании. В LOCAL DEMO QR-картинка остаётся визуальным макетом, но локальные ссылки и статистика источников уже работают.</div><div class="grid">${db.locations.map(l=>{let main=l.sources.find(s=>s.type==='location')||l.sources[0],c=statFor(l.id);return `<div class="a-card s12"><div class="location-head"><div>${fakeQr(main?.token||'demo')}<div class="muted" style="font-size:11px;margin-top:7px;text-align:center">QR preview</div></div><div><div class="row"><h2 class="grow">${esc(l.name)} · ${esc(l.address)}</h2><span class="status ${l.active?'on':'off'}">${l.active?'Точка активна':'Точка выключена'}</span></div><div>${esc(l.city)} · ${esc(l.phone||'телефон не задан')}</div><div class="mini-metrics" style="max-width:520px"><div><b>${c.opens}</b>открытия</div><div><b>${c.positive}</b>👍</div><div><b>${c.negative}</b>👎</div><div><b>${l.sources.length}</b>QR</div></div><div class="row" style="margin-top:12px"><button class="btn light" onclick="editLocation('${l.id}')">Настроить точку</button><button class="btn light" onclick="toggleLocation('${l.id}')">${l.active?'Выключить':'Включить'} точку</button><button class="btn danger" onclick="deleteLocation('${l.id}')">Удалить точку</button></div></div></div><div class="grid" style="margin-top:15px"><div class="s6"><div class="field"><label>Яндекс Карты</label><input value="${esc(l.yandex)}" onchange="savePlatform('${l.id}','yandex',this.value)"></div></div><div class="s6"><div class="field"><label>2ГИС</label><input value="${esc(l.gis)}" onchange="savePlatform('${l.id}','gis',this.value)"></div></div></div><div class="row"><h2 class="grow" style="margin-top:14px">QR-источники</h2><button class="btn green" onclick="addSource('${l.id}')">+ Добавить QR</button></div>${l.sources.map(s=>sourceCard(l,s)).join('')}</div>`}).join('')}</div>`)}
window.savePlatform=(i,p,v)=>{db.locations.find(x=>x.id===i)[p]=v;save();toast('Ссылка сохранена')};
window.addLocation=()=>{let city=prompt('Город','Каменск-Уральский');if(!city)return;let address=prompt('Адрес торговой точки','');if(!address)return;let name=prompt('Название','Мясной Батя')||'Мясной Батя',lid=id('loc'),sid=id('src');db.locations.push({id:lid,name,city,address,phone:'',active:true,yandex:'https://yandex.ru/maps/',gis:'https://2gis.ru/',sources:[{id:sid,type:'location',label:'Основной QR точки',token:token(),active:true}]});save();renderAdmin();toast('Точка и основной QR созданы')};
window.editLocation=i=>{let l=db.locations.find(x=>x.id===i),city=prompt('Город',l.city);if(city===null)return;let address=prompt('Адрес',l.address);if(address===null)return;let phone=prompt('Телефон точки',l.phone||'');if(phone===null)return;l.city=city.trim()||l.city;l.address=address.trim()||l.address;l.phone=phone.trim();save();renderAdmin();toast('Точка обновлена')};
window.toggleLocation=i=>{let l=db.locations.find(x=>x.id===i);l.active=!l.active;save();renderAdmin();toast(l.active?'Точка включена':'Точка выключена')};
window.deleteLocation=i=>{let l=db.locations.find(x=>x.id===i);if(db.locations.length===1)return toast('Нельзя удалить единственную точку');let related=db.events.filter(e=>e.locationId===i).length+db.feedback.filter(f=>f.locationId===i).length;if(!confirm(`Удалить точку «${l.address}»?\nСвязанных DEMO-записей: ${related}. Они тоже будут удалены.`))return;db.locations=db.locations.filter(x=>x.id!==i);db.events=db.events.filter(e=>e.locationId!==i);db.feedback=db.feedback.filter(f=>f.locationId!==i);if(client.locationId===i){client.locationId=db.locations[0].id;client.sourceId=db.locations[0].sources[0].id}save();renderAdmin();toast('Точка удалена')};
window.addSource=i=>{let l=db.locations.find(x=>x.id===i),type=prompt('Тип QR: cashdesk / packaging / receipt / table / delivery / campaign','packaging');if(!type)return;let allowed=['cashdesk','packaging','receipt','table','delivery','campaign'];if(!allowed.includes(type.trim()))return toast('Неизвестный тип QR');let label=prompt('Название QR','QR на упаковке');if(!label)return;l.sources.push({id:id('src'),type:type.trim(),label:label.trim(),token:token(),active:true});save();renderAdmin();toast('QR-источник создан')};
window.toggleSource=(li,si)=>{let s=db.locations.find(x=>x.id===li).sources.find(x=>x.id===si);s.active=!s.active;save();renderAdmin();toast(s.active?'QR включён':'QR выключен')};window.deleteSource=(li,si)=>{let l=db.locations.find(x=>x.id===li),s=l.sources.find(x=>x.id===si);if(!confirm(`Удалить QR «${s.label}»? Связанная DEMO-статистика этого QR будет удалена.`))return;l.sources=l.sources.filter(x=>x.id!==si);db.events=db.events.filter(e=>e.sourceId!==si);db.feedback=db.feedback.filter(f=>f.sourceId!==si);save();renderAdmin();toast('QR удалён')};
window.openSource=(li,si)=>{client.locationId=li;client.sourceId=si;location.hash='r='+encodeURIComponent(db.locations.find(x=>x.id===li).sources.find(x=>x.id===si).token);showClient()};window.copySource=async(si,li)=>{let s=db.locations.find(x=>x.id===li).sources.find(x=>x.id===si),v=localLink(s);try{await navigator.clipboard.writeText(v);toast('Ссылка скопирована')}catch{prompt('Скопируйте ссылку:',v)}};
function scenario(){let t=db.company.texts;shell(`<h1>Сценарий</h1><div class="grid"><div class="a-card s6"><h2>Положительный</h2><div class="field"><label>Вопрос</label><input id="q" value="${esc(t.question)}"></div><div class="field"><label>Заголовок</label><input id="pt" value="${esc(t.positiveTitle)}"></div><div class="field"><label>Предложение</label><textarea id="po">${esc(t.positiveOffer)}</textarea></div><div class="field"><label>Подарок</label><input id="gift" value="${esc(db.company.gift)}"></div><label><input id="bonus" style="width:auto" type="checkbox" ${db.company.bonus?'checked':''}> Бонус включён</label></div><div class="a-card s6"><h2>Негативный</h2><div class="field"><label>Заголовок</label><input id="nt" value="${esc(t.negativeTitle)}"></div><div class="field"><label>Подзаголовок</label><textarea id="ns">${esc(t.negativeSubtitle)}</textarea></div><p class="muted">Еда · Долгое ожидание · Ошибка в заказе · Обслуживание · Чистота · Цена · Другое.</p></div><div class="s12"><button class="btn red" onclick="saveScenario()">Сохранить</button></div></div>`)}window.saveScenario=()=>{Object.assign(db.company.texts,{question:q.value,positiveTitle:pt.value,positiveOffer:po.value,negativeTitle:nt.value,negativeSubtitle:ns.value});db.company.gift=gift.value;db.company.bonus=bonus.checked;save();toast('Сценарий сохранён')};
function design(){shell(`<h1>Оформление</h1><div class="brand-lock"><b>Оформление закреплено брендбуком Business OS.</b><br>Источник: BRANDBOOK_BUSINESS_OS_RU.md + tokens/business-os.tokens.json. Произвольные цвета в интерфейсе отключены.</div><div class="grid"><div class="a-card s6"><h2>Канонические токены</h2><div class="token-grid"><div class="token-chip"><span class="swatch" style="background:#0B1113"></span><b>Brand Dark</b><div class="muted">#0B1113 · навигация</div></div><div class="token-chip"><span class="swatch" style="background:#00C7B7"></span><b>Brand Accent</b><div class="muted">#00C7B7 · CTA / active</div></div><div class="token-chip"><span class="swatch" style="background:#F6F8F9"></span><b>Surface</b><div class="muted">#F6F8F9 · рабочий фон</div></div><div class="token-chip"><span class="swatch" style="background:#1F2933"></span><b>Text</b><div class="muted">#1F2933 · основной текст</div></div><div class="token-chip"><span class="swatch" style="background:#16A34A"></span><b>Success</b><div class="muted">#16A34A · позитив</div></div><div class="token-chip"><span class="swatch" style="background:#DC2626"></span><b>Danger</b><div class="muted">#DC2626 · негатив / destructive</div></div></div><p class="muted">Inter / Arial · радиусы 12 / 16 / 20 / 24 px · стандартная высота поля и основной кнопки 52 px.</p></div><div class="a-card s6"><h2>Предпросмотр клиента</h2><div class="preview-mini"><b>Вы посетили</b><div class="logo" style="width:55px;height:55px;border-radius:16px">МБ</div><b>Мясной Батя</b><div class="pm-card">Вам понравилось?<div class="pm-moods">😄 &nbsp; 😞</div></div></div><p class="muted" style="margin-top:16px">Оригинальный логотип «Мясного Бати» подключается отдельным asset. Визуальные компоненты и геометрия остаются по Business OS.</p></div></div>`)}window.saveDesign=()=>toast('Токены закреплены брендбуком');
function settings(){shell(`<h1>Настройки</h1><div class="grid"><div class="a-card s6"><div class="field"><label>Телефон поддержки</label><input id="phone" value="${esc(db.company.phone)}"></div><div class="field"><label>Email</label><input id="email" value="${esc(db.company.email)}"></div><button class="btn red" onclick="saveSettings()">Сохранить</button></div><div class="a-card s6"><h2>LOCAL DEMO</h2><p>Данные находятся только в localStorage браузера.</p><button class="btn danger" onclick="resetDemo()">Полный сброс DEMO</button></div></div>`)}window.saveSettings=()=>{db.company.phone=phone.value;db.company.email=email.value;save();toast('Настройки сохранены')};window.resetDemo=()=>{if(confirm('Сбросить все локальные DEMO-данные?')){db=clone(defaults);save();client={locationId:'loc1',sourceId:'src1',reason:null};location.hash='';renderAdmin();toast('DEMO сброшена')}};
function showClient(){applyHash();clientRoot.classList.remove('hidden');adminRoot.classList.add('hidden');showClientBtn.classList.add('active');showAdminBtn.classList.remove('active');renderQuestion()}function showAdmin(){clientRoot.classList.add('hidden');adminRoot.classList.remove('hidden');showClientBtn.classList.remove('active');showAdminBtn.classList.add('active');renderAdmin()}window.showClient=showClient;
const clientRoot=document.querySelector('#clientRoot'),adminRoot=document.querySelector('#adminRoot'),showClientBtn=document.querySelector('#showClient'),showAdminBtn=document.querySelector('#showAdmin');showClientBtn.onclick=showClient;showAdminBtn.onclick=showAdmin;db.company.primary='#00C7B7';db.company.background='#F6F8F9';save();applyHash();showClient();
</script>
</body></html>
