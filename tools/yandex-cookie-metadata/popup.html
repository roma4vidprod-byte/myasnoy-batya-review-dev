<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><title>Review DEV — метаданные</title><link rel="stylesheet" href="popup.css"></head>
<body>
  <h1>Только метаданные</h1>
  <p>Оставьте активной вкладку Яндекс Бизнеса нужного аккаунта. Вставьте блок имён, который подготовил PowerShell после скрытого ввода Cookie.</p>
  <label for="request">Блок из PowerShell — не Cookie header и не ключи</label>
  <input id="request" type="password" maxlength="20000" autocomplete="off" spellcheck="false" aria-describedby="notice">
  <p id="notice">Значения cookies не копируются. При ошибке экспорт останавливается целиком.</p>
  <button id="copy" type="button">Скопировать метаданные</button>
  <button id="cancel" type="button">Отмена</button>
  <p id="status" role="status" aria-live="polite">Ожидается блок имён.</p>
  <script type="module" src="popup.js"></script>
</body>
</html>
